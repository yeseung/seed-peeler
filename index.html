        // ================= 2편: 씨 심어키우기 =================
        const E2_MAX    = 20,
              E2_COST   = 3,
              E2_UNLOCK = 10;
        let E = null;

        function e2cfg(n) {
            const boss = n % 5 === 0;
            return {
                n,
                boss,
                time  : 60,
                rate  : 100 / (30 + n * 0.7),
                drain : 6 + n * 0.35,
                bugGap: Math.max(1.2, 2.6 - n * 0.07),
                bugSpd: 26 + n * 0.9,
                beetle: n >= 4,
                moth  : n >= 8,
                weed  : n >= 6,
                crowHp: 3 + Math.floor(n / 10),
            };
        }

        const E2_STORY = {
            1 : "이 몸으로 계속 살 순 없어! 처음 먹은 씨앗의 나무를 키우자",
            2 : "새싹이 났다! 벌레들이 냄새를 맡고 몰려온다",
            4 : "딱딱한 딱정벌레 등장! 두 번 쳐야 도망가요",
            5 : "까악! 도둑 까마귀가 나무를 노린다!",
            6 : "잡초가 물을 빼앗아요. 위로 쓱 뽑아요",
            8 : "나방이 하늘에서 날아온다!",
            10: "까마귀가 친구를 데려왔다!",
            15: "나무가 지붕만큼 자랐다. 까마귀도 더 독해졌다",
            20: "마지막이다! 이 고비만 넘기면 열매가 열린다!",
        };

        function e2gy() {
            return H - 170;
        }

        function startGrow(n) {
            if (SV.bank < E2_COST) return;
            SV.bank -= E2_COST;
            save();
            const c = e2cfg(n + 1);
            state = "grow";
            E = {
                c,
                n,
                t      : c.time,
                grow   : 0,
                water  : 55,
                hp     : 5,
                bugs   : [],
                weeds  : [],
                crow   : null,
                crowT  : c.boss ? 5 : 1e9,
                bugT   : 2,
                weedT  : 6,
                hold   : null,
                pull   : null,
                flicked: 0,
                clock  : 0,
                wsnd   : 0,
                paused : false,
                tut    : !SV.e2intro,
                banner : {
                    text: c.boss ? `2편 ${c.n}단계 · 까마귀 습격!` : `2편 ${c.n}단계`,
                    sub : E2_STORY[c.n] || "물은 알맞게, 벌레는 톡!",
                    t   : 2.8,
                },
            };
        }

        function e2Tap(p, id) {
            if (E.crow && Math.hypot(p.x - E.crow.x, p.y - E.crow.y) < 52) {
                E.crow.hp--;
                E.crow.hit = 0.15;
                tone(300, 0.08, "square", 0.06, 200);
                buzz(25);
                addTrauma(0.15);
                bits(E.crow.x, E.crow.y, "#222", 5);
                if (E.crow.hp <= 0) {
                    pop("까악! 도망갔다", E.crow.x, E.crow.y - 30, "#fff59d", 24, 1);
                    E.crow.flee = true;
                    snd.fly();
                }
                return;
            }
            let best = null,
                bd   = 40;
            for (const b of E.bugs) {
                if (b.dead) continue;
                const d = Math.hypot(p.x - b.x, p.y - b.y);
                if (d < bd) {
                    bd = d;
                    best = b;
                }
            }
            if (best) {
                best.hp--;
                best.hit = 0.12;
                buzz(20);
                if (best.hp <= 0) {
                    best.dead = true;
                    best.vx = (best.x < W / 2 ? -1 : 1) * rnd(300, 500);
                    best.vy = -rnd(350, 550);
                    E.flicked++;
                    snd.fly();
                    tone(900, 0.05, "square", 0.04, 400);
                    pop("톡!", best.x, best.y - 20, "#fff", 20, 0.5);
                    addTrauma(0.1);
                } else {
                    tone(500, 0.05, "square", 0.05);
                    pop("한 번 더!", best.x, best.y - 24, "#ffe082", 15, 0.5);
                }
                return;
            }
            for (const w of E.weeds)
                if (
                    Math.abs(p.x - w.x) < 32 &&
                    p.y > e2gy() - 70 * w.g - 20 &&
                    p.y < e2gy() + 30
                ) {
                    E.pull = {id, w, sy: p.y};
                    return;
                }
            if (!E.hold) E.hold = {id, x: p.x, y: p.y};
        }

        cv.addEventListener("pointerdown", (e) => {
            if (state !== "grow" || performance.now() - lastBtnT < 60 || E.paused)
                return;
            if (E.tut) {
                E.tut = false;
                SV.e2intro = true;
                save();
                return;
            }
            try {
                cv.setPointerCapture(e.pointerId);
            } catch (er) {
            }
            e2Tap(loc(e), e.pointerId);
        });
        cv.addEventListener("pointermove", (e) => {
            if (state !== "grow" || !E) return;
            const p = loc(e);
            if (E.hold && E.hold.id === e.pointerId) {
                E.hold.x = p.x;
                E.hold.y = p.y;
            }
            if (E.pull && E.pull.id === e.pointerId && E.pull.sy - p.y > 40) {
                const w = E.pull.w;
                E.weeds.splice(E.weeds.indexOf(w), 1);
                E.pull = null;
                snd.split();
                buzz(30);
                pop("쑥! 뽑았다", w.x, e2gy() - 50, "#c5e1a5", 20, 0.7);
                bits(w.x, e2gy(), "#6d4c41", 8);
            }
        });

        function e2Up(e) {
            if (!E) return;
            if (E.hold && E.hold.id === e.pointerId) E.hold = null;
            if (E.pull && E.pull.id === e.pointerId) E.pull = null;
        }

        cv.addEventListener("pointerup", e2Up);
        cv.addEventListener("pointercancel", e2Up);

        function e2Target() {
            const s = e2Size();
            return {x: W / 2, y: e2gy() - (30 + 300 * s) * e2SH() * 0.8};
        }

        function e2Size() {
            return clamp((E.n + E.grow / 100) / E2_MAX, 0, 1);
        }

        function e2SH() {
            return Math.min(1, (e2gy() - 150) / 500);
        }

        function e2Update(dt) {
            if (state === "growres") {
                E.resT += dt;
                return;
            }
            if (E.paused || E.tut) return;
            const c = E.c;
            E.clock += dt;
            E.t -= dt;
            if (E.banner) {
                E.banner.t -= dt;
                if (E.banner.t <= 0) E.banner = null;
            }
            // 물
            E.water -= (c.drain + E.weeds.length * 3) * dt;
            if (E.hold) {
                E.water += 38 * dt;
                E.wsnd -= dt;
                if (E.wsnd <= 0) {
                    E.wsnd = 0.12;
                    noise(0.1, 3200, 0.03, 0.8);
                }
                if (Math.random() < 0.5)
                    fx.push({
                        x    : E.hold.x + 16 + rnd(-4, 4),
                        y    : E.hold.y + 10,
                        vx   : rnd(-10, 10),
                        vy   : rnd(150, 260),
                        life : 0.6,
                        color: "#4fc3f7",
                        r    : rnd(2, 4),
                    });
            }
            E.water = clamp(E.water, 0, 110);
            const zone =
                      E.water < 10 ? 0 : E.water < 35 ? 0.35 : E.water <= 88 ? 1 : 0.4;
            E.grow = Math.min(100, E.grow + c.rate * zone * dt);
            if (E.water <= 0) {
                E.dry = (E.dry || 0) + dt;
                if (E.dry > 3) {
                    E.dry = 0;
                    E.hp--;
                    pop("바싹 말랐어요! 체력 -1", W / 2, H * 0.4, "#ffab91", 20, 1.2);
                    snd.yuck();
                }
            } else E.dry = 0;
            // 벌레
            E.bugT -= dt;
            if (E.bugT <= 0) {
                E.bugT = c.bugGap * rnd(0.7, 1.3);
                const side = Math.random() < 0.5 ? -1 : 1,
                      r    = Math.random();
                const type =
                          c.moth && r < 0.25
                              ? "moth"
                              : c.beetle && r < 0.55
                                  ? "beetle"
                                  : "cat";
                E.bugs.push(
                    type === "moth"
                        ? {
                            type,
                            x : side < 0 ? -20 : W + 20,
                            y : rnd(110, 200),
                            hp: 1,
                            sp: c.bugSpd * 1.7,
                            ph: rnd(0, 6),
                        }
                        : {
                            type,
                            x : side < 0 ? -20 : W + 20,
                            y : e2gy() - 8,
                            hp: type === "beetle" ? 2 : 1,
                            sp: c.bugSpd * (type === "beetle" ? 0.8 : 1),
                            ph: rnd(0, 6),
                        },
                );
            }
            const tg = e2Target();
            for (let i = E.bugs.length - 1; i >= 0; i--) {
                const b = E.bugs[i];
                if (b.hit > 0) b.hit -= dt;
                if (b.dead) {
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    b.vy += 1400 * dt;
                    b.rot = (b.rot || 0) + dt * 14;
                    if (b.y > H + 40) E.bugs.splice(i, 1);
                    continue;
                }
                if (b.type === "moth") {
                    const dx = tg.x - b.x,
                          dy = tg.y - b.y,
                          d  = Math.hypot(dx, dy) || 1;
                    b.x +=
                        (dx / d) * b.sp * dt + Math.sin(E.clock * 6 + b.ph) * 40 * dt;
                    b.y +=
                        (dy / d) * b.sp * dt + Math.cos(E.clock * 5 + b.ph) * 30 * dt;
                    if (d < 26) {
                        e2Bite(b, i);
                    }
                } else {
                    b.x += Math.sign(W / 2 - b.x) * b.sp * dt;
                    if (Math.abs(b.x - W / 2) < 22) e2Bite(b, i);
                }
            }
            // 잡초
            if (c.weed) {
                E.weedT -= dt;
                if (E.weedT <= 0 && E.weeds.length < 3) {
                    E.weedT = rnd(5, 8);
                    E.weeds.push({
                        x: W / 2 + (Math.random() < 0.5 ? -1 : 1) * rnd(50, 120),
                        g: 0,
                    });
                }
                E.weeds.forEach((w) => (w.g = Math.min(1, w.g + dt * 0.8)));
            }
            // 까마귀
            E.crowT -= dt;
            if (!E.crow && E.crowT <= 0) {
                const side = Math.random() < 0.5 ? -1 : 1;
                E.crow = {
                    x  : side < 0 ? -40 : W + 40,
                    y  : 180,
                    side,
                    hp : c.crowHp,
                    t  : 0,
                    hit: 0,
                };
                tone(520, 0.25, "sawtooth", 0.06, -200);
                pop("까악!", W / 2, 230, "#fff", 30, 0.9);
            }
            if (E.crow) {
                const k = E.crow;
                k.t += dt;
                if (k.hit > 0) k.hit -= dt;
                if (k.flee) {
                    k.x += -k.side * 420 * dt;
                    k.y -= 260 * dt;
                    if (k.y < -60) {
                        E.crow = null;
                        E.crowT = Math.max(5, 9 - c.n * 0.15);
                    }
                } else if (k.t < 2.4) {
                    k.x += (k.side < 0 ? 1 : -1) * 110 * dt;
                    k.y = 180 + Math.sin(k.t * 3) * 14;
                } else {
                    const dx = tg.x - k.x,
                          dy = tg.y - k.y,
                          d  = Math.hypot(dx, dy) || 1;
                    k.x += (dx / d) * 150 * dt;
                    k.y += (dy / d) * 150 * dt;
                    if (d < 24) {
                        E.grow = Math.max(0, E.grow - 15);
                        E.hp--;
                        addTrauma(0.6);
                        snd.boom();
                        buzz(200);
                        pop(
                            "까마귀가 쪼았다! 성장 -15",
                            W / 2,
                            H * 0.4,
                            "#ff8a80",
                            20,
                            1.3,
                        );
                        k.flee = true;
                    }
                }
            }
            if (E.grow >= 100) return e2End(true);
            if (E.hp <= 0) return e2End(false, "나무가 시들었어요…");
            if (E.t <= 0) return e2End(false, "시간이 다 됐어요…");
        }

        function e2Bite(b, i) {
            E.bugs.splice(i, 1);
            E.hp--;
            E.grow = Math.max(0, E.grow - 4);
            addTrauma(0.3);
            snd.yuck();
            buzz(100);
            pop("아삭! 갉아먹혔다 -1", W / 2, H * 0.42, "#ff8a80", 20, 1);
        }

        function e2End(win, msg) {
            state = "growres";
            E.win = win;
            E.msg = msg;
            E.resT = 0;
            E.hold = null;
            E.pull = null;
            E.coin = 0;
            if (win) {
                E.coin = 12 + (E.c.boss ? 15 : 0);
                SV.coins += E.coin;
                SV.e2lv = Math.max(SV.e2lv, Math.min(E.n + 1, E2_MAX));
                snd.win();
                buzz(80);
            } else {
                snd.cry();
                buzz(250);
            }
            save();
        }

        // ---------- 그리기 ----------
        function drawTree(x, gy, size, hp, t) {
            const k = e2SH();
            if (size < 0.05) {
                // 새싹
                const s = 1 + size * 12;
                ctx.strokeStyle = "#7cb342";
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(x, gy);
                ctx.quadraticCurveTo(x + 4, gy - 16 * s, x, gy - 30 * s);
                ctx.stroke();
                [-1, 1].forEach((d) => {
                    ctx.fillStyle = d < 0 ? "#8bc34a" : "#9ccc65";
                    ctx.beginPath();
                    ctx.ellipse(
                        x + d * 12 * s,
                        gy - 32 * s,
                        13 * s,
                        7 * s,
                        d * -0.5 + Math.sin(t * 2) * 0.08,
                        0,
                        TAU,
                    );
                    ctx.fill();
                });
                return;
            }
            const th   = (30 + 300 * size) * k,
                  tw   = (6 + 34 * size) * k,
                  sway = Math.sin(t * 1.3) * 3 * size;
            const g = ctx.createLinearGradient(x - tw, 0, x + tw, 0);
            g.addColorStop(0, "#8d5a34");
            g.addColorStop(0.5, "#a8713f");
            g.addColorStop(1, "#5d3a1e");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(x - tw, gy);
            ctx.quadraticCurveTo(
                x - tw * 0.45,
                gy - th * 0.5,
                x - tw * 0.3 + sway,
                gy - th,
            );
            ctx.lineTo(x + tw * 0.3 + sway, gy - th);
            ctx.quadraticCurveTo(x + tw * 0.45, gy - th * 0.5, x + tw, gy);
            ctx.fill();
            ctx.strokeStyle = "rgba(60,35,15,.4)";
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(x + rnd0(i) * tw * 0.5, gy - th * (0.15 + i * 0.2));
                ctx.lineTo(x + rnd0(i + 3) * tw * 0.4, gy - th * (0.25 + i * 0.2));
                ctx.stroke();
            }
            const cy0  = gy - th - 6 * k,
                  rx   = (30 + size * 120) * k,
                  ry   = (24 + size * 90) * k,
                  n    = Math.floor(4 + size * 15),
                  sick = hp <= 2;
            for (let i = 0; i < n; i++) {
                const a   = i * 2.4,
                      rr0 = Math.sqrt((i + 0.5) / n),
                      bx  =
                          x + sway + Math.cos(a) * rx * rr0 + Math.sin(t * 1.5 + i) * 2,
                      by  = cy0 + Math.sin(a) * ry * rr0 * 0.9,
                      r   = (18 + size * 36) * k * (0.8 + Math.abs(rnd0(i)) * 0.4);
                const c = ctx.createRadialGradient(
                    bx - r * 0.35,
                    by - r * 0.4,
                    r * 0.1,
                    bx,
                    by,
                    r,
                );
                const bad = sick && i % 3 === 0;
                c.addColorStop(0, bad ? "#d4c26a" : "#aee571");
                c.addColorStop(
                    0.7,
                    bad ? "#a68b3c" : i % 2 ? "#5fae3a" : "#4c9a2f",
                );
                c.addColorStop(1, bad ? "#7a6424" : "#2e6b1c");
                ctx.fillStyle = c;
                ctx.beginPath();
                ctx.arc(bx, by, r, 0, TAU);
                ctx.fill();
            }
        }

        function drawBug(b, t) {
            ctx.save();
            ctx.translate(b.x, b.y);
            if (b.dead) ctx.rotate(b.rot || 0);
            const dir = b.dead ? 1 : b.x < W / 2 ? 1 : -1;
            ctx.scale(dir, 1);
            if (b.hit > 0) ctx.translate(rnd(-3, 3), rnd(-3, 3));
            if (b.type === "cat") {
                for (let i = 3; i >= 0; i--) {
                    ctx.fillStyle = i % 2 ? "#7cb342" : "#9ccc65";
                    ctx.beginPath();
                    ctx.arc(
                        -i * 9,
                        -6 - Math.abs(Math.sin(t * 8 + i)) * 4,
                        8,
                        0,
                        TAU,
                    );
                    ctx.fill();
                }
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(3, -9, 3, 0, TAU);
                ctx.fill();
                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(4, -9, 1.5, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = "#33691e";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(2, -13);
                ctx.lineTo(6, -20);
                ctx.moveTo(-1, -13);
                ctx.lineTo(-2, -20);
                ctx.stroke();
            } else if (b.type === "beetle") {
                ctx.strokeStyle = "#111";
                ctx.lineWidth = 2;
                for (let i = -1; i <= 1; i++) {
                    const w = Math.sin(t * 14 + i) * 3;
                    ctx.beginPath();
                    ctx.moveTo(i * 8, -4);
                    ctx.lineTo(i * 10 + w, 2);
                    ctx.stroke();
                }
                const g = ctx.createRadialGradient(-4, -14, 2, 0, -9, 16);
                g.addColorStop(0, "#7e57c2");
                g.addColorStop(1, "#1a0f3a");
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, -9, 16, 11, 0, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,.3)";
                ctx.beginPath();
                ctx.moveTo(-14, -9);
                ctx.lineTo(10, -9);
                ctx.stroke();
                ctx.fillStyle = "#111";
                ctx.beginPath();
                ctx.arc(15, -8, 6, 0, TAU);
                ctx.fill();
                if (b.hp === 1) {
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-6, -16);
                    ctx.lineTo(-1, -9);
                    ctx.lineTo(-7, -4);
                    ctx.stroke();
                }
            } else {
                const f = Math.sin(t * 30) * 0.7;
                [-1, 1].forEach((s) => {
                    ctx.save();
                    ctx.scale(1, s);
                    ctx.rotate(-f * 0.5);
                    ctx.fillStyle = "#bcaaa4";
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-16, -22);
                    ctx.lineTo(12, -18);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = "#8d6e63";
                    ctx.beginPath();
                    ctx.arc(-4, -13, 3, 0, TAU);
                    ctx.fill();
                    ctx.restore();
                });
                ctx.fillStyle = "#5d4037";
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 4, 0, 0, TAU);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawCrow(k, t) {
            ctx.save();
            ctx.translate(k.x + (k.hit > 0 ? rnd(-4, 4) : 0), k.y);
            const dir = k.flee ? -k.side : k.x < W / 2 ? 1 : -1;
            ctx.scale(dir * 1.25, 1.25);
            const f = Math.sin(t * 16) * 0.8;
            ctx.fillStyle = "#1b1b1f";
            [-1, 1].forEach((s) => {
                ctx.save();
                ctx.scale(1, s);
                ctx.rotate(-0.3 - f * 0.4);
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.quadraticCurveTo(-20, -34, -34, -20);
                ctx.quadraticCurveTo(-18, -12, 6, 0);
                ctx.fill();
                ctx.restore();
            });
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 11, 0, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(17, -5, 9, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-18, 0);
            ctx.lineTo(-34, 6);
            ctx.lineTo(-30, -4);
            ctx.fill();
            ctx.fillStyle = "#ff9800";
            ctx.beginPath();
            ctx.moveTo(24, -7);
            ctx.lineTo(38, -3);
            ctx.lineTo(24, 0);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(19, -7, 3, 0, TAU);
            ctx.fill();
            ctx.fillStyle = "#d50000";
            ctx.beginPath();
            ctx.arc(20, -7, 1.6, 0, TAU);
            ctx.fill();
            ctx.restore();
            for (let i = 0; i < k.hp; i++) {
                ctx.fillStyle = "#ff5252";
                ctx.beginPath();
                ctx.arc(k.x - (k.hp - 1) * 6 + i * 12, k.y - 34, 4, 0, TAU);
                ctx.fill();
            }
        }

        function drawGrow() {
            const t  = performance.now() / 1000,
                  gy = e2gy(),
                  c  = E.c;
            const sky = ctx.createLinearGradient(0, 0, 0, gy);
            sky.addColorStop(0, c.boss ? "#90a4ae" : "#81d4fa");
            sky.addColorStop(1, c.boss ? "#cfd8dc" : "#e1f5fe");
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, gy);
            if (!c.boss) {
                ctx.fillStyle = "#fff59d";
                ctx.beginPath();
                ctx.arc(60, 110, 26, 0, TAU);
                ctx.fill();
            }
            ctx.fillStyle = "rgba(255,255,255,.8)";
            [
                [240, 100, 1],
                [110, 170, 0.7],
                [320, 190, 0.8],
            ].forEach(([x0, y0, s]) => {
                const x = ((x0 + t * 6 * s) % (W + 120)) - 60;
                ctx.beginPath();
                ctx.arc(x, y0, 18 * s, 0, TAU);
                ctx.arc(x + 20 * s, y0 - 8 * s, 22 * s, 0, TAU);
                ctx.arc(x + 44 * s, y0, 17 * s, 0, TAU);
                ctx.fill();
            });
            ctx.fillStyle = "#a5d6a7";
            ctx.beginPath();
            ctx.moveTo(0, gy);
            ctx.quadraticCurveTo(90, gy - 70, 190, gy - 20);
            ctx.quadraticCurveTo(280, gy - 60, W, gy - 10);
            ctx.lineTo(W, gy);
            ctx.fill();
            const gg = ctx.createLinearGradient(0, gy, 0, H);
            gg.addColorStop(0, "#7cb342");
            gg.addColorStop(0.12, "#8d6e63");
            gg.addColorStop(1, "#5d4037");
            ctx.fillStyle = gg;
            ctx.fillRect(0, gy, W, H - gy);
            const wet = clamp(E.water / 100, 0, 1);
            ctx.fillStyle = `rgba(40,25,15,${0.15 + wet * 0.35})`;
            ctx.beginPath();
            ctx.ellipse(W / 2, gy + 14, 90, 16, 0, 0, TAU);
            ctx.fill();
            if (E.water > 92) {
                ctx.fillStyle = "rgba(79,195,247,.6)";
                ctx.beginPath();
                ctx.ellipse(W / 2, gy + 12, 100, 12, 0, 0, TAU);
                ctx.fill();
            }
            drawTree(W / 2, gy + 4, e2Size(), E.hp, t);
            E.weeds.forEach((w) => {
                ctx.save();
                ctx.translate(w.x, gy + 4);
                ctx.scale(w.g, w.g);
                ctx.strokeStyle = "#33691e";
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                for (let i = -2; i <= 2; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(
                        i * 10,
                        -30,
                        i * 16 + Math.sin(t * 3 + i) * 3,
                        -52 - (2 - Math.abs(i)) * 8,
                    );
                    ctx.stroke();
                }
                ctx.restore();
            });
            E.bugs.forEach((b) => drawBug(b, t));
            if (E.crow) drawCrow(E.crow, t);
            drawMini(
                FORMS[formIdx(SV.lv + 1)],
                52,
                H - 16,
                FORMS[formIdx(SV.lv + 1)].deco ? 0.34 : 0.46,
                0.2,
            );
            if (E.hold) {
                const x = E.hold.x,
                      y = E.hold.y - 30;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(0.5);
                ctx.fillStyle = "#4fc3f7";
                rr(-22, -16, 40, 30, 6);
                ctx.fill();
                ctx.fillStyle = "#0288d1";
                ctx.fillRect(16, -8, 26, 7);
                ctx.beginPath();
                ctx.arc(44, -5, 7, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = "#0288d1";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(-22, -2, 12, Math.PI * 0.5, Math.PI * 1.5);
                ctx.stroke();
                ctx.restore();
            }
            // 상단
            ctx.fillStyle = "rgba(27,60,20,.9)";
            ctx.fillRect(0, 0, W, 56);
            txt(
                `2편 ${c.n}/${E2_MAX}단계`,
                12,
                16,
                13,
                c.boss ? "#ff8a80" : "#c5e1a5",
                "left",
                false,
                900,
            );
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = i < E.hp ? "#8bc34a" : "rgba(255,255,255,.2)";
                ctx.beginPath();
                ctx.ellipse(18 + i * 17, 39, 7, 5, -0.5, 0, TAU);
                ctx.fill();
            }
            txt(
                `${Math.ceil(Math.max(0, E.t))}초`,
                W - 52,
                17,
                16,
                E.t < 10 ? "#ff8a80" : "#fff",
                "right",
                false,
                900,
            );
            ctx.fillStyle = "rgba(255,255,255,.18)";
            rr(W - 42, 5, 34, 26, 8);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.fillRect(W - 31, 11, 4, 14);
            ctx.fillRect(W - 23, 11, 4, 14);
            if (state === "grow" && !E.paused && !E.tut)
                btns.push({
                    x : W - 48,
                    y : 0,
                    w : 48,
                    h : 36,
                    cb: () => {
                        E.paused = true;
                        E.hold = null;
                    },
                });
            const gx = 110,
                  gw = W - 170;
            ctx.fillStyle = "rgba(255,255,255,.2)";
            rr(gx, 34, gw, 14, 7);
            ctx.fill();
            ctx.fillStyle = "#ffd54f";
            rr(gx, 34, Math.max(14, (gw * E.grow) / 100), 14, 7);
            ctx.fill();
            txt(
                `성장 ${Math.floor(E.grow)}%`,
                gx + gw / 2,
                41,
                10,
                "#fff",
                "center",
                true,
                800,
            );
            // 물 게이지
            const wx = W - 30,
                  wy = 90,
                  wh = Math.min(220, gy - 200);
            ctx.fillStyle = "rgba(0,0,0,.35)";
            rr(wx - 2, wy - 2, 22, wh + 4, 10);
            ctx.fill();
            ctx.fillStyle = "rgba(139,195,74,.5)";
            ctx.fillRect(
                wx,
                wy + wh * (1 - 88 / 110),
                18,
                (wh * (88 - 35)) / 110,
            );
            const wv = clamp(E.water / 110, 0, 1);
            ctx.fillStyle =
                E.water < 35 ? "#ffb74d" : E.water > 88 ? "#7e57c2" : "#29b6f6";
            rr(wx, wy + wh * (1 - wv), 18, Math.max(6, wh * wv), 8);
            ctx.fill();
            txt("물", wx + 9, wy - 14, 13, "#01579b", "center", false, 900);
            // 큰 안내
            if (state === "grow" && !E.paused && !E.tut) {
                const nearBug = E.bugs.some(
                    (b) =>
                        (!b.dead &&
                            Math.hypot(b.x - W / 2, b.y - e2Target().y) < 190) ||
                        (!b.dead && b.type !== "moth" && Math.abs(b.x - W / 2) < 130),
                );
                const h =
                          E.crow && !E.crow.flee
                              ? ["까마귀를 톡톡톡!", "#ffccbc", "#ff5722", "#7a1f00"]
                              : E.water > 92
                                  ? ["물이 넘쳐요! 손 떼기", "#e1bee7", "#7e57c2", "#311b92"]
                                  : E.water < 30
                                      ? ["꾹 눌러 물 주기!", "#e1f5fe", "#29b6f6", "#01579b"]
                                      : nearBug
                                          ? ["벌레를 톡!", "#fff59d", "#ff9800", "#6d3a00"]
                                          : E.weeds.length
                                              ? ["잡초를 위로 쓱!", "#f0f4c3", "#7cb342", "#33691e"]
                                              : null;
                if (h)
                    text3D(
                        h[0],
                        W / 2,
                        86 + Math.sin(t * 5) * 3,
                        28,
                        h[1],
                        h[2],
                        h[3],
                    );
            }
            if (E.banner && state === "grow") {
                ctx.globalAlpha = Math.min(1, E.banner.t * 2);
                ctx.fillStyle = "rgba(27,60,20,.9)";
                rr(16, H * 0.42 - 40, W - 32, 82, 14);
                ctx.fill();
                txt(E.banner.text, W / 2, H * 0.42 - 12, 22, "#fff59d");
                txt(
                    E.banner.sub,
                    W / 2,
                    H * 0.42 + 20,
                    12.5,
                    "#fff",
                    "center",
                    true,
                    800,
                );
                ctx.globalAlpha = 1;
            }
            if (state === "grow" && E.tut) {
                ctx.fillStyle = "rgba(20,12,6,.75)";
                ctx.fillRect(0, 0, W, H);
                const y0 = H * 0.5 - 170;
                ctx.fillStyle = "#fff8e1";
                rr(24, y0, W - 48, 340, 22);
                ctx.fill();
                ctx.strokeStyle = "#8bc34a";
                ctx.lineWidth = 6;
                rr(24, y0, W - 48, 340, 22);
                ctx.stroke();
                text3D(

        function btn3D(x, y, w, h, label, cb, o = {}) {
            const c1   = o.c1 || "#ffd54f",
                  c2   = o.c2 || "#ff9800",
                  side = o.side || "#a85f00",
                  fs   = o.fs || 18,
                  r    = Math.min(h / 2, 18);
            ctx.fillStyle = side;
            rr(x, y + 5, w, h, r);
            ctx.fill();
            const g = ctx.createLinearGradient(0, y, 0, y + h);
            g.addColorStop(0, c1);
            g.addColorStop(1, c2);
            ctx.fillStyle = g;
            rr(x, y, w, h, r);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.35)";
            rr(x + 6, y + 4, w - 12, h * 0.32, r * 0.6);
            ctx.fill();
            txt(
                label,
                x + w / 2,
                y + h / 2 + 1,
                fs,
                o.tc || "#4e2a00",
                "center",
                false,
                900,
            );
            if (cb) btns.push({x, y, w, h: h + 5, cb});

                      D === "monster"
                          ? ["#2a0a12", "#6d1b27", "#3a1a12"]
                          : D === "king"
                              ? ["#0e0828", "#3a1b6b", "#2a1840"]
                              : D === "god"
                                  ? ["#fffde7", "#ffe082", "#d9a441"]
                                  : D === "ultra"
                                      ? ["#e3f2fd", "#fff9c4", "#c69c6d"]

            g.addColorStop(0, pal[0]);
            g.addColorStop(1, pal[1]);

        function drawFood() {
            const mx = W / 2,
                  my = H - 92;
            G.food.forEach((f) => {
                const k = Math.max(0, f.t),
                      x = f.x + (mx - f.x) * k,
                      y = f.y + (my - f.y) * k - Math.sin(k * Math.PI) * 120;
                const s = f.t < 0 ? 0.55 + (1 + f.t / 0.18) * 0.25 : 0.8 - k * 0.6;
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(s, s);
                ctx.rotate(k * 6);
                const d = SEEDS[f.key];
                drawKernel(f.key, d.w, d.h, f.color);
                ctx.restore();
            });

                  y0  = 66,
                  ch  = Math.min(100, (H - y0 - 66) / 6 - gap);
            DEX_ALL.forEach((F, i) => {
                const x   = x0 + (i % 3) * (cw + gap),
                      y   = y0 + Math.floor(i / 3) * (ch + gap),
                      got = SV.dex[F.id];
                ctx.fillStyle = got ? "#fff8e1" : "rgba(255,255,255,.25)";
                rr(x, y, cw, ch, 12);
                ctx.fill();
                ctx.strokeStyle =
                    i < 6 ? "#ffb74d" : i < 12 ? "#f48fb1" : "#a1887f";
                ctx.lineWidth = 3;
                rr(x, y, cw, ch, 12);
                ctx.stroke();
                if (got) {
                    ctx.save();
                    rr(x + 2, y + 2, cw - 4, ch - 18, 10);
                    ctx.clip();
                    drawMini(F, x + cw / 2, y + ch - 16, F.deco ? 0.2 : 0.26, 0.15);
                    ctx.restore();
                    txt(
                        F.name,
                        x + cw / 2,
                        y + ch - 9,
                        11,
                        "#5d4037",
                        "center",
                        false,
                        900,
                    );
                } else {
                    txt(
                        "?",
                        x + cw / 2,
                        y + ch / 2 - 8,
                        30,
                        "rgba(255,255,255,.8)",
                        "center",
                        false,
                    );
                    txt(
                        i < 6
                            ? `Lv.${F.lv}`
                            : (i < 12 ? "씨앗의 길" : "견과의 길") + ` Lv.${F.lv}`,
                        x + cw / 2,
                        y + ch - 10,
                        10,
                        "#fff",
                        "center",
                        false,
                        800,
                    );
                }
            });
            btn3D(W / 2 - 80, H - 56, 160, 42, "돌아가기", goTitle, {fs: 16});
        }

        function drawShop() {
            const keep = G;
            G = null;
            drawBg();
            G = keep;
            ctx.fillStyle = "rgba(40,22,10,.45)";
            ctx.fillRect(0, 0, W, H);
            text3D("모자 상점", 96, 36, 26);
            coinPill(W - 112, 22);
            HATS.forEach(([id, name, price], i) => {
                const y   = 70 + i * 58,
                      own = SV.hats[id],
                      on  = SV.hat === id;
                ctx.fillStyle = on ? "#fff3c4" : "#fff8e1";
                rr(16, y, W - 32, 50, 12);
                ctx.fill();
                txt(name, 32, y + 18, 15, "#5d4037", "left", false, 900);
                txt(
                    own ? "가지고 있음" : `코인 ${price}`,
                    32,
                    y + 37,
                    11,
                    own ? "#7cb342" : "#bf360c",
                    "left",
                    false,
                    800,
                );
                if (on)
                    txt(
                        "착용 중",
                        W - 70,
                        y + 25,
                        14,
                        "#f57c00",
                        "center",
                        false,
                        900,
                    );
                else if (own)
                    btn3D(
                        W - 116,
                        y + 7,
                        92,
                        32,
                        "착용",
                        () => {
                            SV.hat = id;
                            save();
                        },
                        {fs: 14, c1: "#c5e1a5", c2: "#7cb342", side: "#33691e"},
                    );
                else
                    btn3D(
                        W - 116,
                        y + 7,
                        92,
                        32,
                        "구매",
                        () => {
                            if (SV.coins >= price) {
                                SV.coins -= price;
                                SV.hats[id] = 1;
                                SV.hat = id;
                                save();
                                snd.coin();
                            } else pop("코인이 모자라요", W / 2, y, "#ff8a80", 18, 1);
                        },
                        {
                            fs  : 14,
                            c1  : SV.coins >= price ? "#ffd54f" : "#e0e0e0",
                            c2  : SV.coins >= price ? "#ff9800" : "#bdbdbd",
                            side: SV.coins >= price ? "#a85f00" : "#757575",
                        },
                    );
            });
            const F = FORMS[formIdx(SV.lv + 1)];
            drawMini(F, W / 2, H - 70, F.deco ? 0.5 : 0.75, 0.2);
            btn3D(W / 2 - 80, H - 56, 160, 42, "돌아가기", goTitle, {fs: 16});
        }

        function drawResult() {
            ctx.fillStyle = "rgba(30,18,10,.66)";
            ctx.fillRect(0, 0, W, H - 170);
            const y  = H * 0.13,
                  bw = W - 120;
            if (G.endless) {
                text3D("무한 모드 끝!", W / 2, y, 30);
                text3D(
                    `${G.peeled}개 깠다!`,
                    W / 2,
                    y + 56,
                    34,
                    "#e1f5fe",
                    "#29b6f6",
                    "#01579b",
                );
                txt(
                    G.newBest ? "새 최고 기록!" : `최고 기록 ${SV.endBest}개`,
                    W / 2,
                    y + 100,
                    16,
                    "#fff59d",
                    "center",
                    true,
                    900,
                );
                txt(
                    `코인 +${G.coinGain}`,
                    W / 2,
                    y + 128,
                    15,
                    "#ffd54f",
                    "center",
                    true,
                    900,
                );
                if (G.resT > 1) {
                    btn3D(60, y + 160, bw, 48, "다시 도전", startEndless);
                    btn3D(60, y + 220, bw, 40, "홈으로", goTitle, {
                        c1  : "#eeeeee",
                        c2  : "#bdbdbd",
                        side: "#757575",
                        fs  : 15,
                    });
                }
                return;
            }
            if (G.win) {
                text3D(
                    S + 1 >= MAXL ? "엔딩!" : `Lv.${S + 1} 클리어!`,
                    W / 2,
                    y,
                    34,
                );
                for (let i = 0; i < 3; i++) {
                    const on = i < G.stars,
                          k  = clamp(G.resT * 3 - i * 0.4, 0, 1);
                    txt(
                        on ? "★" : "☆",
                        W / 2 - 52 + i * 52,
                        y + 50,
                        40 * (on ? (k < 1 ? 0.5 + k * 0.7 : 1) : 1),
                        on ? "#ffd54f" : "#8d6e63",
                    );
                }
                txt(
                    `${G.score.toLocaleString()}점 · 코인 +${G.coinGain} · 씨 +${G.peeled}`,
                    W / 2,
                    y + 92,
                    15,
                    "#fff",
                    "center",
                    true,
                    800,
                );
                if (G.choose) {
                    txt(
                        "어…? 몸이 또 이상해…!",
                        W / 2,
                        y + 130,
                        18,
                        "#ffe082",
                        "center",
                        true,
                        900,
                    );
                    txt(
                        "앞으로 무엇을 더 먹일까요? (모습이 달라져요)",
                        W / 2,
                        y + 156,
                        12.5,
                        "#fff",
                        "center",
                        true,
                        800,
                    );
                    if (G.resT > 1) {
                        btn3D(
                            24,
                            y + 178,
                            W / 2 - 34,
                            64,
                            "씨앗을 더!",
                            () => choosePath("pig"),
                            {c1: "#fff59d", c2: "#fbc02d", side: "#8a6d00", fs: 18},
                        );
                        btn3D(
                            W / 2 + 10,
                            y + 178,
                            W / 2 - 34,
                            64,
                            "견과를 더!",
                            () => choosePath("bear"),
                            {c1: "#d7ccc8", c2: "#a1887f", side: "#4e342e", fs: 18},
                        );
                    }
                    return;
                }
                if (S + 1 >= MAXL) {
                    txt(
                        `${FORMS[G.form].name}이(가) 되어`,
                        W / 2,
                        y + 134,
                        18,
                        "#fff59d",
                        "center",
                        true,
                        900,
                    );
                    txt(
                        "세상의 모든 씨를 다 깠다!",
                        W / 2,
                        y + 160,
                        18,
                        "#fff59d",
                        "center",
                        true,
                        900,
                    );
                    txt(
                        "다른 길의 모습도 도감에서 확인해 보세요",
                        W / 2,
                        y + 186,
                        12,
                        "#fff",
                        "center",
                        true,
                        800,
                    );
                } else if (G.evolveTo !== undefined) {
                    if (G.evolved) {
                        const F = FORMS[G.evolveTo];
                        text3D(
                            `진화! ${F.name}`,
                            W / 2,
                            y + 136,
                            26,
                            "#e1f5fe",
                            "#29b6f6",
                            "#01579b",
                        );
                        txt(F.story, W / 2, y + 170, 13, "#fff", "center", true, 800);
                    } else
                        txt(
                            "어…? 몸이 이상해…!",
                            W / 2,
                            y + 136,
                            18,
                            "#ffe082",
                            "center",
                            true,
                            900,
                        );
                } else
                    txt(
                        `다음: ${LV(S + 1).title}`,
                        W / 2,
                        y + 136,
                        16,
                        "#c5e1a5",
                        "center",
                        true,
                        800,
                    );
                if (G.resT > (G.evolveTo !== undefined ? 2.4 : 1.1)) {
                    if (S + 1 < MAXL)
                        btn3D(
                            60,
                            y + 200,
                            bw,
                            52,
                            "다음 단계",
                            () => startStage(S + 1),
                            {fs: 22},
                        );
                    btn3D(
                        60,
                        y + (S + 1 < MAXL ? 266 : 210),
                        bw,
                        38,
                        "홈으로",
                        goTitle,
                        {c1: "#eeeeee", c2: "#bdbdbd", side: "#757575", fs: 15},
                    );
                }
            } else {
                text3D(G.msg, W / 2, y, 26, "#ffccbc", "#ff7043", "#7a1f00");
                txt(
                    `깐 개수 ${G.peeled}개 · ${G.score.toLocaleString()}점`,
                    W / 2,
                    y + 44,
                    15,
                    "#fff",
                    "center",
                    true,
                    800,
                );
                txt(
                    G.near
                        ? `아까워요! ${G.near}%만 더 채우면 성공!`
                        : "더 빨리 까서 먹여 줘요!",
                    W / 2,
                    y + 74,
                    15,
                    "#ffe0b2",
                    "center",
                    true,
                    800,
                );
                if (G.resT > 1) {
                    let by = y + 104;
                    if (!G.revived) {
                        const can = SV.coins >= REVIVE_COST;
                        btn3D(
                            40,
                            by,
                            W - 80,
                            52,
                            `코인 ${REVIVE_COST}으로 이어하기 (+15초)`,
                            can
                                ? revive
                                : () => pop("코인이 모자라요", W / 2, by, "#ff8a80", 18, 1),
                            can
                                ? {fs: 16, c1: "#c5e1a5", c2: "#7cb342", side: "#33691e"}
                                : {fs: 16, c1: "#e0e0e0", c2: "#bdbdbd", side: "#757575"},
                        );
                        txt(
                            `가진 코인 ${SV.coins}`,
                            W / 2,
                            by + 70,
                            11,
                            "#fff",
                            "center",
                            true,
                            800,
                        );
                        by += 86;
                    }
                    btn3D(60, by, bw, 46, "다시 하기", () => startStage(S));
                    btn3D(60, by + 58, bw, 38, "홈으로", goTitle, {
                        c1  : "#eeeeee",
                        c2  : "#bdbdbd",
                        side: "#757575",
                        fs  : 15,
                    });
                }
            }
        }

        // ================= 루프 =================
        let last  = performance.now(),
            clock = 0;

        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            clock += dt;
            update(dt);
            btns.length = 0;
            const sh = SV.opt.shake ? trauma * trauma : 0;
            ctx.save();
            if (sh > 0) {
                ctx.translate(rnd(-1, 1) * 14 * sh, rnd(-1, 1) * 14 * sh);
                ctx.rotate(rnd(-1, 1) * 0.025 * sh);
            }
            if (state === "title") drawTitle(clock);
            else if (state === "dex") drawDex();
            else if (state === "shop") drawShop();
            else if (state === "grow" || state === "growres") drawGrow();
            else {
                drawBg();
                drawKid();
                drawSeed();
                drawGuide();
                drawFood();
                if (G.combo >= 5 && state === "play") {
                    const a = 0.25 + Math.sin(clock * 10) * 0.15;
                    ctx.strokeStyle = `rgba(255,112,67,${a})`;
                    ctx.lineWidth = 14;
                    ctx.strokeRect(7, 7, W - 14, H - 14);
                }
                drawHUD();
                if (state === "play") {
                    drawTutorial();
                    if (G.paused) drawPause();
                }
                if (state === "result") drawResult();
            }
            fx.forEach((p) => {
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.8));
                ctx.fillStyle = p.color;
                if (p.shard) {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.beginPath();
                    ctx.moveTo(-p.r, -p.r * 0.4);
                    ctx.lineTo(p.r, -p.r * 0.7);
                    ctx.lineTo(p.r * 0.6, p.r * 0.6);
                    ctx.lineTo(-p.r * 0.7, p.r * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, TAU);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;
            pops.forEach((p) => {
                const age = p.max - p.life,
                      k   =
                          age < 0.12
                              ? 0.5 + (age / 0.12) * 0.7
                              : age < 0.2
                                  ? 1.2 - ((age - 0.12) / 0.08) * 0.2
                                  : 1;
                ctx.globalAlpha = Math.min(1, (p.life / p.max) * 2);
                txt(p.text, p.x, p.y, p.size * k, p.color);
            });
            ctx.globalAlpha = 1;
            ctx.restore();
            requestAnimationFrame(frame);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden && state === "play" && G && !G.tut)
                G.paused = true;
            if (document.hidden && state === "grow" && E) {
                E.paused = true;
                E.hold = null;
            }
        });
        window.__sg = {
            set skipTut(v) {
                skipTut = v;
            },
            get FORMS() {
                return FORMS;
            },
            LV,
            SV,
            btns,
            DEX_ALL,
            get G() {
                return G;
            },
            get E() {
                return E;
            },
            startGrow,
            get state() {
                return state;
            },
            set state(v) {
                state = v;
            },
            get S() {
                return S;
            },
            get H() {
                return H;
            },
            shellInfo() {
                const r = [];
                for (const k of Object.keys(SEEDS)) {
                    const t0 = performance.now();
                    delete shellCache[k];
                    const s = getShell(k);
                    r.push(k + ":" + Math.round(performance.now() - t0) + "ms");
                    s.c.style.height = "330px";
                    document.body.appendChild(s.c);
                }
                return r.join(" ");
            },
            startStage,
            startEndless,
            goTitle,
            choosePath,
            save,
            clearDaily() {
                pendingDaily = 0;
            },
        };
        requestAnimationFrame(frame);
    })();
</script>
</body>
</html>
