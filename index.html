                        Rt = x;
                    }
                Ls[y] = L;
                Rs[y] = Rt;
            }
            const sm = (A) => {
                const B = new Float32Array(PH);
                for (let y = 0; y < PH; y++) {
                    if (A[y] < 0) {
                        B[y] = -1;
                        continue;
                    }
                    let t = 0,
                        n = 0;
                    for (let k = -4; k <= 4; k++) {
                        const yy = y + k;
                        if (yy >= 0 && yy < PH && A[yy] >= 0) {
                            t += A[yy];
                            n++;
                        }
                    }
                    B[y] = t / n;
                }
                return B;
            };
            const Lm = sm(Ls),
                  Rm = sm(Rs);
            // 둥근 높이를 먼저 만들고 흐리게 해서 각진 자국을 없앰
            let dome = new Float32Array(N);
            for (let i = 0; i < N; i++)
                if (dist[i]) {
                    const t = Math.min(1, dist[i] / R);
                    dome[i] = Math.sqrt(1 - (1 - t) * (1 - t)) * R * bulge;
                }
            const blur = (A) => {
                const B = new Float32Array(N),
                      C = new Float32Array(N),
                      r = 3;
                for (let y = 0; y < PH; y++)
                    for (let x = r; x < PW - r; x++) {
                        let t = 0;
                        for (let k = -r; k <= r; k++) t += A[y * PW + x + k];
                        B[y * PW + x] = t / (2 * r + 1);
                    }
                for (let y = r; y < PH - r; y++)
                    for (let x = 0; x < PW; x++) {
                        let t = 0;
                        for (let k = -r; k <= r; k++) t += B[(y + k) * PW + x];
                        C[y * PW + x] = t / (2 * r + 1);
                    }
                return C;
            };
            dome = blur(blur(dome));
            for (let y = 0; y < PH; y++) {
                if (Ls[y] < 0) continue;
                const mid  = (Lm[y] + Rm[y]) / 2,
                      half = Math.max(1, (Rm[y] - Lm[y]) / 2);
                for (let x = Ls[y]; x <= Rs[y]; x++) {
                    const i = y * PW + x;
                    if (!dist[i]) continue;
                    const m = mat(
                        (x - PW / 2) / SC,
                        (y - PH / 2) / SC,
                        clamp((x - mid) / half, -1, 1),
                        dist[i] / SC,
                        d,
                    );
                    HT[i] = dome[i] + m.h * SC * 1.25;
                    alb[i * 3] = m.c[0];
                    alb[i * 3 + 1] = m.c[1];
                    alb[i * 3 + 2] = m.c[2];
                    spc[i] = m.sp;
                }
            }
            const lx = -0.46,
                  ly = -0.6,
                  lz = 0.655,
                  hx = lx,
                  hy = ly,
                  hz = lz + 1,
                  hl = Math.hypot(hx, hy, hz);
            for (let y = 1; y < PH - 1; y++)
                for (let x = 1; x < PW - 1; x++) {
                    const i = y * PW + x;
                    if (!dist[i]) {
                        continue;
                    }
                    let nx = -(HT[i + 1] - HT[i - 1]) * 0.5,
                        ny = -(HT[i + PW] - HT[i - PW]) * 0.5,
                        nz = 1;
                    const nl = Math.hypot(nx, ny, nz);
                    nx /= nl;
                    ny /= nl;
                    nz /= nl;
                    const diff = Math.max(0, nx * lx + ny * ly + nz * lz),
                          back = Math.max(0, -nx * lx - ny * ly) * 0.12;
                    const sp =
                              Math.pow(
                                  Math.max(0, (nx * hx + ny * hy + nz * hz) / hl),
                                  shin,
                              ) *
                              spc[i] *
                              255;
                    const ao = 0.72 + 0.28 * Math.min(1, dist[i] / (9 * SC)),
                          k  = (0.34 + 0.9 * diff + back) * ao,
                          o  = i * 4;
                    px[o] = Math.min(255, alb[i * 3] * k + sp);
                    px[o + 1] = Math.min(255, alb[i * 3 + 1] * k + sp);
                    px[o + 2] = Math.min(255, alb[i * 3 + 2] * k + sp * 0.95);
                }
            g.putImageData(img, 0, 0);
            if (key === "chestnut") {
                g.save();
                g.scale(SC, SC);
                g.translate(w / 2, h / 2);
                g.strokeStyle = "#d9c7a0";
                g.lineWidth = 1.6;
                g.lineCap = "round";
                for (let k = -5; k <= 5; k++) {
                    g.beginPath();
                    g.moveTo(k * 1.4, -d.h / 2 + 8);
                    g.quadraticCurveTo(
                        k * 2.5,
                        -d.h / 2 - 6,
                        k * 3.6 + rnd0(k + 9) * 3,
                        -d.h / 2 - 15 - Math.abs(rnd0(k)) * 6,
                    );
                    g.stroke();
                }
                g.restore();
            }
            const out = document.createElement("canvas");
            out.width = PW;
            out.height = PH;
            const o2 = out.getContext("2d");
            o2.shadowColor = "rgba(50,25,8,.45)";
            o2.shadowBlur = 14 * SC;
            o2.shadowOffsetX = 7 * SC;
            o2.shadowOffsetY = 11 * SC;
            o2.drawImage(c, 0, 0);
            return {c: out, w, h};
        }

        function getShell(key) {
            if (shellCache[key]) return shellCache[key];
            try {
                return (shellCache[key] = renderShell(key));
            } catch (e) {
                const d = SEEDS[key],
                      w = d.w + 80,
                      h = d.h + 90,
                      c = document.createElement("canvas");
                c.width = w * 2;
                c.height = h * 2;
                const keep = ctx;
                ctx = c.getContext("2d");
                ctx.scale(2, 2);
                ctx.translate(w / 2, h / 2);
                drawShellRaw(key, d.w, d.h);
                ctx = keep;
                return (shellCache[key] = {c, w, h});
            }
        }

        // 게임 시작 전에 미리 조금씩 만들어 둠 (플레이 중 멈칫 방지)
        (function warm(keys) {
            if (!keys.length) return;
            setTimeout(() => {
                getShell(keys[0]);
                warm(keys.slice(1));
            }, 80);
        })(Object.keys(SEEDS));

        function drawShell(key, w, h) {
            const d  = SEEDS[key],
                  s  = getShell(key),
                  sx = w / d.w,
                  sy = h / d.h;
            ctx.drawImage(
                s.c,
                (-s.w / 2) * sx,
                (-s.h / 2) * sy,
                s.w * sx,
                s.h * sy,
            );
        }

        function modOverlay(sd, d, t) {
            if (!sd.mod) return;
            ctx.save();
            seedPath(sd.key, d.w, d.h);
            ctx.clip();
            if (sd.mod === "gold") {
                ctx.globalCompositeOperation = "color";
                ctx.fillStyle = "#ffc400";
                ctx.fillRect(-d.w, -d.h, d.w * 2, d.h * 2);
                ctx.globalCompositeOperation = "source-over";
                const sh = ((t / 0.6) % 2) - 0.5,
                      g  = ctx.createLinearGradient(-d.w, -d.h, d.w, d.h);
                g.addColorStop(clamp(sh, 0, 1), "rgba(255,255,255,0)");
                g.addColorStop(clamp(sh + 0.08, 0, 1), "rgba(255,255,255,.6)");
                g.addColorStop(clamp(sh + 0.16, 0, 1), "rgba(255,255,255,0)");
                ctx.fillStyle = g;
                ctx.fillRect(-d.w, -d.h, d.w * 2, d.h * 2);
            } else if (sd.mod === "rotten") {
                ctx.fillStyle = "rgba(70,105,25,.55)";
                ctx.fillRect(-d.w, -d.h, d.w * 2, d.h * 2);
                for (let i = 0; i < 14; i++) {
                    ctx.fillStyle =
                        i % 2 ? "rgba(40,30,10,.55)" : "rgba(150,170,60,.5)";
                    ctx.beginPath();
                    ctx.ellipse(
                        rnd0(i + 60) * d.w * 0.35,
                        rnd0(i + 70) * d.h * 0.38,
                        10 + Math.abs(rnd0(i)) * 16,
                        8 + Math.abs(rnd0(i + 2)) * 10,
                        i,
                        0,
                        TAU,
                    );
                    ctx.fill();
                }
            } else if (sd.mod === "bomb") {
                ctx.fillStyle = `rgba(255,30,20,${0.2 + Math.abs(Math.sin(t * (4 + (1 - sd.timer / sd.timer0) * 10))) * 0.3})`;
                ctx.fillRect(-d.w, -d.h, d.w * 2, d.h * 2);
            } else if (
                sd.mod === "frozen" &&
                sd.steps[sd.step] &&
                sd.steps[sd.step].a === "rub"
            ) {
                const a = 1 - sd.prog;
                ctx.fillStyle = `rgba(165,220,255,${0.82 * a})`;
                ctx.fillRect(-d.w, -d.h, d.w * 2, d.h * 2);
                ctx.strokeStyle = `rgba(255,255,255,${0.8 * a})`;
                ctx.lineWidth = 3;
                for (let i = 0; i < 12; i++) {
                    const x0 = rnd0(i + 80) * d.w * 0.4,
                          y0 = rnd0(i + 90) * d.h * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(x0, y0);
                    ctx.lineTo(x0 + 26, y0 - 34);
                    ctx.moveTo(x0 + 10, y0 - 14);
                    ctx.lineTo(x0 + 24, y0 - 8);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawSeed() {
            const sd = G.seed,
                  d  = sd.d,
                  t  = performance.now() / 1000;
            const x =
                      cx() + (sd.shake > 0 ? rnd(-5, 5) : 0) + sd.enter * 300 + sd.ox,
                  y = cy() + sd.oy;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(sd.rot + sd.spin);
            const act0 = sd.steps[sd.step],
                  sp   = act0 && act0.a === "split" && !sd.done ? sd.prog : 0;
            ctx.scale(
                1 - sd.squash * 0.9 + sp * 0.07,
                1 + sd.squash * 0.6 - sp * 0.04,
            );
            if (!sd.done || sd.pieces.some((p) => !p.gone))
                drawKernel(sd.key, d.w, d.h, d.kernel);
            sd.pieces.forEach((pc) => {
                if (pc.gone) return;
                ctx.save();
                ctx.translate(pc.dx, pc.dy);
                ctx.rotate(pc.r);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, 400, pc.a0, pc.a1);
                ctx.closePath();
                ctx.clip();
                drawShell(sd.key, d.w, d.h);
                modOverlay(sd, d, t);
                ctx.strokeStyle = "#2a1608";
                ctx.lineWidth = 3;
                sd.crackLines.forEach((l) => {
                    ctx.beginPath();
                    l.forEach(([a, b], i) =>
                        i ? ctx.lineTo(a, b) : ctx.moveTo(a, b),
                    );
                    ctx.stroke();
                });
                ctx.restore();
            });
            if (sd.mod === "bomb" && !sd.done) {
                // 심지와 불꽃
                const k   = sd.timer / sd.timer0,
                      top = -d.h / 2;
                ctx.strokeStyle = "#5d4037";
                ctx.lineWidth = 6;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(0, top + 6);
                ctx.quadraticCurveTo(26, top - 20, 20 + 30 * k, top - 20 - 30 * k);
                ctx.stroke();
                const fxp = 20 + 30 * k,
                      fyp = top - 20 - 30 * k;
                for (let i = 0; i < 6; i++) {
                    ctx.fillStyle = i % 2 ? "#ffeb3b" : "#ff5722";
                    ctx.beginPath();
                    ctx.arc(fxp + rnd(-7, 7), fyp + rnd(-7, 7), rnd(3, 7), 0, TAU);
                    ctx.fill();
                }
            }
            if (sd.mod === "rotten" && !sd.done) {
                // 날파리와 냄새
                for (let i = 0; i < 4; i++) {
                    const a = t * (3 + i) + i * 1.7;
                    ctx.fillStyle = "#222";
                    ctx.beginPath();
                    ctx.arc(
                        Math.cos(a) * (d.w * 0.5 + 14),
                        Math.sin(a * 1.3) * d.h * 0.32,
                        3.5,
                        0,
                        TAU,
                    );
                    ctx.fill();
                }
                ctx.strokeStyle = "rgba(110,150,40,.7)";
                ctx.lineWidth = 4;
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    for (let k = 0; k <= 8; k++) {
                        const yy = -d.h / 2 - 8 - k * 6,
                              xx = i * 34 + Math.sin(k * 0.9 + t * 4 + i) * 7;
                        k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
                    }
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function text3D(
            s,
            x,
            y,
            size,
            c1   = "#fff59d",
            c2   = "#ff9800",
            side = "#6d3a00",
        ) {
            ctx.font = `900 ${size}px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineJoin = "round";
            ctx.fillStyle = "rgba(0,0,0,.25)";
            ctx.fillText(s, x + 4, y + size * 0.22);
            for (let i = Math.round(size * 0.14); i > 0; i--) {
                ctx.fillStyle = side;
                ctx.lineWidth = size * 0.16;
                ctx.strokeStyle = side;
                ctx.strokeText(s, x, y + i);
                ctx.fillText(s, x, y + i);
            }
            ctx.lineWidth = size * 0.16;
            ctx.strokeStyle = "#fff";
            ctx.strokeText(s, x, y);
            const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
            g.addColorStop(0, c1);
            g.addColorStop(1, c2);
            ctx.fillStyle = g;
            ctx.fillText(s, x, y);
        }

        function arrow3D(x, y, ang, len, col = "#ffca28") {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);
            const shape = () => {
                ctx.beginPath();
                ctx.moveTo(0, -9);
                ctx.lineTo(len - 22, -9);
                ctx.lineTo(len - 22, -22);
                ctx.lineTo(len, 0);
                ctx.lineTo(len - 22, 22);
                ctx.lineTo(len - 22, 9);
                ctx.lineTo(0, 9);
                ctx.closePath();
            };
            ctx.translate(0, 6);
            ctx.fillStyle = "#8a4b00";
            shape();
            ctx.fill();
            ctx.translate(0, -6);
            const g = ctx.createLinearGradient(0, -22, 0, 22);
            g.addColorStop(0, "#fff8c4");
            g.addColorStop(0.5, col);
            g.addColorStop(1, "#f57f17");
            ctx.fillStyle = g;
            shape();
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            shape();
            ctx.stroke();
            ctx.restore();
        }

        function finger3D(x, y, press) {
            // 누르는 손가락: 물결 고리 + 그림자 + 큰 손가락
            const t = performance.now() / 1000;
            ctx.strokeStyle = `rgba(255,255,255,${0.7 - ((t * 1.5) % 1) * 0.7})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(x, y, 18 + ((t * 1.5) % 1) * 26, 0, TAU);
            ctx.stroke();
            ctx.fillStyle = "rgba(0,0,0,.25)";
            ctx.beginPath();
            ctx.ellipse(x + 6, y + 8, 18, 9, 0, 0, TAU);
            ctx.fill();
            // 직접 그린 입체 손가락 (끝이 (x, y)를 누름)
            ctx.save();
            ctx.translate(x, y + (press ? 4 : 0));
            ctx.rotate(-0.12);
            const skin = ctx.createLinearGradient(-16, 0, 16, 0);
            skin.addColorStop(0, "#f3c39d");
            skin.addColorStop(0.45, "#ffe3cc");
            skin.addColorStop(1, "#d99a72");
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#7a4a2a";
            ctx.fillStyle = skin;
            rr(-22, 46, 52, 44, 16);
            ctx.fill();
            ctx.stroke(); // 손바닥
            [
                [-8, 52],
                [6, 54],
                [19, 56],
            ].forEach(([fx, fy]) => {
                rr(fx - 7, fy - 12, 14, 22, 7);
                ctx.fill();
                ctx.stroke();
            }); // 접은 손가락
            ctx.fillStyle = skin;
            rr(-12, 0, 24, 64, 12);
            ctx.fill();
            ctx.stroke(); // 검지
            ctx.fillStyle = "#fff1e6";
            rr(-7, 3, 14, 14, 6);
            ctx.fill();
            ctx.strokeStyle = "rgba(122,74,42,.5)";
            ctx.lineWidth = 1.5;
            ctx.stroke(); // 손톱
            ctx.strokeStyle = "rgba(122,74,42,.45)";
            ctx.beginPath();
            ctx.moveTo(-6, 30);
            ctx.lineTo(6, 30);
            ctx.moveTo(-6, 42);
            ctx.lineTo(6, 42);
            ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,.35)";
            rr(-9, 18, 5, 40, 3);
            ctx.fill();
            ctx.restore();
        }

        function drawGuide() {
            const sd = G.seed;
            if (sd.done || G.tut || state !== "play" || G.paused) return;
            const act = sd.steps[sd.step];
            if (!act) return;
            const t = performance.now() / 1000,
                  X = cx(),
                  Y = cy();
            const show = clamp((G.idleT || 0) * 2 - 0.3, 0, 1);
            const by = Math.min(H - 160, Y + sd.d.h / 2 + 34);
            const word = {
                split  : "양쪽으로 쫙!",
                squeeze: `꽉 눌러! ${sd.cracks}/${act.n}`,
                pick   : "끌어서 떼!",
                rub    : "문질러 녹여!",
                toss   : "썩었어! 휙 버려!",
            }[act.a];
            const pal = {
                split  : ["#fff59d", "#ff9800", "#6d3a00"],
                squeeze: ["#ffccbc", "#ff5722", "#7a1f00"],
                pick   : ["#e1f5fe", "#29b6f6", "#01579b"],
                rub    : ["#ffffff", "#81d4fa", "#01579b"],
                toss   : ["#f0f4c3", "#7cb342", "#33691e"],
            }[act.a];
            text3D(
                word,
                X,
                96 + Math.sin(t * 5) * 3,
                34 + show * 4,
                pal[0],
                pal[1],
                pal[2],
            );
            if (act.a === "split" || act.a === "rub") {
                ctx.fillStyle = "rgba(0,0,0,.35)";
                rr(60, by - 22, W - 120, 12, 6);
                ctx.fill();
                const g = ctx.createLinearGradient(0, by - 22, 0, by - 10);
                g.addColorStop(0, pal[0]);
                g.addColorStop(1, pal[1]);
                ctx.fillStyle = g;
                rr(60, by - 22, Math.max(12, (W - 120) * sd.prog), 12, 6);
                ctx.fill();
            }
            if (sd.timer0 > 0) {
                // 남은 시간 고리
                const k  = clamp(sd.timer / sd.timer0, 0, 1),
                      tx = W - 44,
                      ty = 150;
                ctx.fillStyle = "rgba(40,20,10,.75)";
                ctx.beginPath();
                ctx.arc(tx, ty, 28, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = k < 0.35 ? "#ff5252" : "#ffca28";
                ctx.lineWidth = 7;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.arc(tx, ty, 22, -Math.PI / 2, -Math.PI / 2 + TAU * k);
                ctx.stroke();
                txt(
                    String(Math.ceil(sd.timer)),
                    tx,
                    ty + 1,
                    22 * (k < 0.35 ? 1 + Math.sin(t * 20) * 0.1 : 1),
                    "#fff",
                    "center",
                    false,
                );
            }
            if (show <= 0) return;
            ctx.save();
            ctx.globalAlpha = show;
            if (act.a === "split") {
                const k = (t * 0.9) % 1,
                      o = 30 + k * 90;
                arrow3D(X - 40, Y, Math.PI, 110);
                arrow3D(X + 40, Y, 0, 110);
                finger3D(X - o, Y + 24, k < 0.15);
                finger3D(X + o, Y + 24, k < 0.15);
            } else if (act.a === "squeeze") {
                const k = (t * 1.2) % 1,
                      o = 150 - k * 90;
                arrow3D(X - 160, Y, 0, 100, "#ff8a65");
                arrow3D(X + 160, Y, Math.PI, 100, "#ff8a65");
                finger3D(X - o, Y + 24, k > 0.85);
                finger3D(X + o, Y + 24, k > 0.85);
            } else if (act.a === "pick") {
                const pc = sd.pieces.find((p) => !p.gone && !p.fly);
                if (pc) {
                    const a  = (pc.a0 + pc.a1) / 2 + sd.rot,
                          k  = (t * 0.8) % 1,
                          r0 = 60 + k * 110;
                    arrow3D(
                        X + Math.cos(a) * 60,
                        Y + Math.sin(a) * 60,
                        a,
                        120,
                        "#81d4fa",
                    );
                    finger3D(X + Math.cos(a) * r0, Y + Math.sin(a) * r0, false);
                }
            } else if (act.a === "rub") {
                const k = t * 3;
                finger3D(X + Math.sin(k) * 70, Y + Math.sin(k * 0.5) * 60, true);
            } else if (act.a === "toss") {
                const k = (t * 1.1) % 1;
                arrow3D(X - 20, Y, 0, 150, "#aed581");
                finger3D(X - 40 + k * 160, Y + 24, false);
            }
            ctx.restore();
        }

        function drawTutorial() {
            if (!G.tut) return;
            const T = G.tut,
                  d = SEEDS[T.key];
            ctx.fillStyle = "rgba(20,12,6,.72)";
            ctx.fillRect(0, 0, W, H);
            const y0 = H * 0.16,
                  hh = H * 0.6;
            ctx.fillStyle = "#fff8e1";
            rr(24, y0, W - 48, hh, 22);
            ctx.fill();
            ctx.strokeStyle = "#ffb74d";
            ctx.lineWidth = 6;
            rr(24, y0, W - 48, hh, 22);
            ctx.stroke();
            text3D(T.mod ? "조심! 새로운 씨" : "새로운 씨!", W / 2, y0 + 44, 28);
            ctx.save();
            ctx.translate(W / 2, y0 + hh * 0.42);
            const sc = 140 / Math.max(d.w, d.h);
            ctx.scale(sc, sc);
            drawShell(T.key, d.w, d.h);
            if (T.mod)
                modOverlay(
                    {
                        key   : T.key,
                        mod   : T.mod,
                        timer : 1,
                        timer0: 1,
                        prog  : 0,
                        step  : 0,
                        steps : [{a: "rub"}],
                    },
                    d,
                    performance.now() / 1000,
                );
            ctx.restore();
            txt(
                T.title,
                W / 2,
                y0 + hh * 0.42 + 92,
                26,
                "#5d4037",
                "center",
                false,
                900,
            );
            txt(
                T.how[0],
                W / 2,
                y0 + hh * 0.42 + 128,
                16,
                "#bf360c",
                "center",
                false,
                900,
            );
            txt(
                T.how[1],
                W / 2,
                y0 + hh * 0.42 + 153,
                16,
                "#bf360c",
                "center",
                false,
                900,
            );
            ctx.globalAlpha = 0.6 + Math.sin(performance.now() / 200) * 0.4;
            txt(
                "화면을 눌러 시작!",
                W / 2,
                y0 + hh - 24,
                18,
                "#6d4c41",
                "center",
                false,
                900,
            );
            ctx.globalAlpha = 1;
        }

        function drawForm(F, fat) {
            if (!F.kind) drawHuman(F.h);
            else drawAnimal(F.kind, fat, F.deco);
        }

        function drawKid() {
            const F = FORMS[G.form];
            if (!F.kind) return drawHuman(F.h);
            const L = G.endless ? SV.lv + 1 : S + 1;
            drawAnimal(
                F.kind,
                clamp(tierProg(L, G.form) * 0.55 + (G.belly / 100) * 0.45, 0, 1),
                F.deco,
            );
        }

        function drawMini(F, x, y, sc, fat = 0.25) {
            // 도감·메뉴용 작은 캐릭터 (발밑 가운데가 x, y)
            const keep = G;
            G = DUM;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(sc, sc);
            ctx.translate(-W / 2, -(H - 30));
            drawForm(F, fat);
            ctx.restore();
            G = keep;
        }

        function drawHat(r, y) {
            const h = SV.hat;
            if (!h || h === "none") return;
            const k = r / 50;
            ctx.save();
            ctx.translate(0, y);
            ctx.scale(k, k);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(60,30,10,.5)";
            if (h === "straw") {
                ctx.fillStyle = "#e2bd5a";
                ctx.beginPath();
                ctx.ellipse(0, 6, 52, 11, 0, 0, TAU);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#f2d680";
                rr(-26, -24, 52, 30, 12);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#c62828";
                ctx.fillRect(-26, -4, 52, 8);
            } else if (h === "chef") {
                ctx.fillStyle = "#fff";
                [
                    [-17, -22, 15],
                    [0, -30, 18],
                    [17, -22, 15],
                ].forEach(([a, b, c]) => {
                    ctx.beginPath();
                    ctx.arc(a, b, c, 0, TAU);
                    ctx.fill();
                    ctx.stroke();
                });
                rr(-24, -12, 48, 20, 4);
                ctx.fill();
                ctx.stroke();
            } else if (h === "party") {
                const g = ctx.createLinearGradient(-18, 0, 18, 0);
                g.addColorStop(0, "#ec407a");
                g.addColorStop(1, "#7e57c2");
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(-20, 6);
                ctx.lineTo(0, -52);
                ctx.lineTo(20, 6);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = "#fff59d";
                [
                    [-6, -12],
                    [5, -26],
                    [-2, -2],
                    [8, -6],
                ].forEach(([a, b]) => {
                    ctx.beginPath();
                    ctx.arc(a, b, 3, 0, TAU);
                    ctx.fill();
                });
                ctx.fillStyle = "#ffeb3b";
                ctx.beginPath();
                ctx.arc(0, -54, 7, 0, TAU);
                ctx.fill();
                ctx.stroke();
            } else if (h === "ribbon") {
                ctx.fillStyle = "#e53935";
                [-1, 1].forEach((s) => {
                    ctx.beginPath();
                    ctx.moveTo(0, -6);
                    ctx.lineTo(s * 34, -26);
                    ctx.lineTo(s * 34, 12);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                });
                ctx.fillStyle = "#ff8a80";
                ctx.beginPath();
                ctx.arc(0, -6, 9, 0, TAU);
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawTail(x, y, sc, t) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(sc, sc);
            ctx.rotate(Math.sin(t * 2.4) * 0.06);
            const path = () => {
                ctx.beginPath();
                ctx.moveTo(0, 40);
                ctx.bezierCurveTo(70, 40, 80, -30, 40, -70);
                ctx.bezierCurveTo(10, -100, 70, -140, 95, -105);
                ctx.bezierCurveTo(130, -60, 120, 30, 60, 70);
                ctx.bezierCurveTo(30, 85, 0, 70, 0, 40);
            };
            const g = ctx.createLinearGradient(0, -130, 110, 70);
            g.addColorStop(0, "#d98a4a");
            g.addColorStop(0.6, "#a95a26");
            g.addColorStop(1, "#7a3e18");
            ctx.fillStyle = g;
            path();
            ctx.fill();
            ctx.save();
            path();
            ctx.clip();
            ctx.strokeStyle = "rgba(255,220,180,.35)";
            ctx.lineWidth = 1.6;
            for (let i = 0; i < 70; i++) {
                const a  = i * 2.39,
                      r  = 10 + (i % 9) * 11,
                      sx = 55 + Math.cos(a) * r * 0.9,
                      sy = -30 + Math.sin(a) * r * 1.2;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + 9, sy - 6);
                ctx.stroke();
            }
            ctx.restore();
            // 바깥 털 삐침
            ctx.strokeStyle = "#8a4a1e";
            ctx.lineWidth = 2;
            for (let i = 0; i < 24; i++) {
                const a  = (i / 24) * TAU,
                      sx = 60 + Math.cos(a) * 58,
                      sy = -30 + Math.sin(a) * 92;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + Math.cos(a) * 9, sy + Math.sin(a) * 9);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawHuman(form) {
            const x     = W / 2,
                  baseY = H - 104,
                  m     = G ? G.mood : "idle",
                  t     = performance.now() / 1000;
            const belly = G ? G.belly : 50,
                  chew  = G && G.chew > 0 ? Math.abs(Math.sin(t * 22)) : 0;
            const bounce =
                      G && G.kidBounce > 0
                          ? Math.sin((G.kidBounce / 0.25) * Math.PI) * 6
                          : 0;
            const breathe = Math.sin(t * 2.2) * 1.5;
            const y = baseY - bounce;
            if (form >= 3) drawTail(x + 40, y + 40, 0.75, t);
            // --- 몸: 줄무늬 티셔츠, 배는 먹을수록 동그랗게 (귀여운 정도까지만) ---
            const bw = 62 + belly * 0.12,
                  bh = 44 + belly * 0.05;
            const sg = ctx.createLinearGradient(x - bw, 0, x + bw, 0);
            sg.addColorStop(0, "#f3b25d");
            sg.addColorStop(0.5, "#ffcf7d");
            sg.addColorStop(1, "#e09a45");
            ctx.fillStyle = sg;
            ctx.beginPath();
            ctx.ellipse(x, y + 74 + breathe * 0.4, bw, bh, 0, 0, TAU);
            ctx.fill();
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(x, y + 74 + breathe * 0.4, bw, bh, 0, 0, TAU);
            ctx.clip();
            ctx.strokeStyle = "rgba(255,255,255,.55)";
            ctx.lineWidth = 6;
            for (let k = -2; k <= 3; k++) {
                ctx.beginPath();
                ctx.ellipse(x, y + 60 + k * 15, bw + 10, 10, 0, 0, Math.PI);
                ctx.stroke();
            }
            const bl = ctx.createRadialGradient(
                x - bw * 0.3,
                y + 60,
                4,
                x,
                y + 74,
                bw,
            );
            bl.addColorStop(0, "rgba(255,255,255,.35)");
            bl.addColorStop(1, "rgba(0,0,0,.18)");
            ctx.fillStyle = bl;
            ctx.fillRect(x - bw, y + 20, bw * 2, bh * 2 + 20);
            ctx.restore();
            // 팔과 손
            const skin = (cx0, cy0, r) => {
                const g = ctx.createRadialGradient(
                    cx0 - r * 0.3,
                    cy0 - r * 0.35,
                    r * 0.1,
                    cx0,
                    cy0,
                    r,
                );
                g.addColorStop(0, "#ffe9d8");
                g.addColorStop(0.75, "#f6c9a6");
                g.addColorStop(1, "#e3a77f");
                return g;
            };
            [-1, 1].forEach((sd) => {
                const hx = x + sd * (bw - 6),
                      hy =
                          y +
                          52 +
                          (m === "eat" ? -Math.abs(Math.sin(t * 11)) * 6 : 0) +
                          (m === "cry" ? -18 : 0);
                ctx.fillStyle = form >= 2 ? "#b8743c" : skin(hx, hy, 13);
                ctx.beginPath();
                ctx.arc(hx, hy, 13, 0, TAU);
                ctx.fill();
                if (form >= 2) {
                    ctx.strokeStyle = "#7a4520";
                    ctx.lineWidth = 1.5;
                    for (let k = 0; k < 10; k++) {
                        const a = (k / 10) * TAU;
                        ctx.beginPath();
                        ctx.moveTo(hx + Math.cos(a) * 11, hy + Math.sin(a) * 11);
                        ctx.lineTo(hx + Math.cos(a) * 16, hy + Math.sin(a) * 16);
                        ctx.stroke();
                    }
                }
            });
            // --- 얼굴 ---
            const fy = y + breathe * 0.5,
                  R  = 50;
            ctx.save();
            ctx.translate(x, fy);
            if (m === "cry") ctx.rotate(Math.sin(t * 18) * 0.03);
            // 귀
            [-1, 1].forEach((sd) => {
                ctx.fillStyle = skin(sd * R * 0.95, 4, 13);
                ctx.beginPath();
                ctx.ellipse(sd * R * 0.95, 4, 11, 15, 0, 0, TAU);
                ctx.fill();
                ctx.fillStyle = "rgba(200,120,90,.35)";
                ctx.beginPath();
                ctx.ellipse(sd * R * 0.95, 5, 5, 8, 0, 0, TAU);
                ctx.fill();
            });
            // 볼: 먹을 때 빵빵
            const puff = chew * 6 + (m === "full" ? 5 : 0);
            ctx.fillStyle = skin(0, 6, R + 6);
            ctx.beginPath();
            ctx.ellipse(0, 4, R + puff * 0.5, R - 2, 0, 0, TAU);
            ctx.fill();
            [-1, 1].forEach((sd) => {
                ctx.fillStyle = skin(sd * 28, 20, 24);
                ctx.beginPath();
                ctx.ellipse(
                    sd * (27 + puff * 0.5),
                    20,
                    22 + puff,
                    18 + puff * 0.6,
                    0,
                    0,
                    TAU,
                );
                ctx.fill();
            });
            // 볼 홍조
            [-1, 1].forEach((sd) => {
                const g = ctx.createRadialGradient(
                    sd * 30,
                    18,
                    1,
                    sd * 30,
                    18,
                    16 + puff,
                );
                g.addColorStop(
                    0,
                    `rgba(255,120,120,${m === "full" || m === "eat" ? 0.55 : 0.35})`,
                );
                g.addColorStop(1, "rgba(255,120,120,0)");
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sd * 30, 18, 16 + puff, 0, TAU);
                ctx.fill();
            });
            // 머리카락 (윤기 + 가닥)
            const hg = ctx.createLinearGradient(0, -R - 10, 0, -5);
            hg.addColorStop(0, "#5a3a24");
            hg.addColorStop(1, "#2e1c10");
            const hairPath = () => {
                ctx.beginPath();
                ctx.moveTo(-R - 2, 2);
                ctx.bezierCurveTo(-R - 6, -R - 12, R + 6, -R - 12, R + 2, 2);
                ctx.bezierCurveTo(R - 6, -14, R * 0.45, -24, R * 0.2, -16);
                ctx.bezierCurveTo(0, -26, -R * 0.3, -14, -R * 0.5, -22);
                ctx.bezierCurveTo(-R * 0.7, -12, -R + 4, -12, -R - 2, 2);
            };
            ctx.fillStyle = hg;
            hairPath();
            ctx.fill();
            ctx.save();
            hairPath();
            ctx.clip();
            ctx.strokeStyle = "rgba(150,100,62,.45)";
            ctx.lineWidth = 1.8;
            for (let k = -5; k <= 5; k++) {
                ctx.beginPath();
                ctx.moveTo(k * 7, -R * 0.95);
                ctx.quadraticCurveTo(k * 10 + 3, -R * 0.55, k * 9 + 2, -14);
                ctx.stroke();
            }
            ctx.fillStyle = "rgba(255,255,255,.2)";
            ctx.beginPath();
            ctx.ellipse(-12, -R * 0.62, 18, 5, -0.25, 0, TAU);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = "#3a2414";
            ctx.lineWidth = 3.5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(2, -R * 0.78);
            ctx.quadraticCurveTo(14, -R - 8, 3, -R - 12);
            ctx.stroke();
            if (form >= 1) {
                const pk = G && G.poof > 0 && G.form === 1 ? 1 - G.poof / 0.6 : 1;
                [-1, 1].forEach((sd) => {
                    ctx.save();
                    ctx.translate(sd * R * 0.6, -R * 0.78);
                    ctx.rotate(sd * 0.35 + Math.sin(t * 3 + sd) * 0.05);
                    ctx.scale(pk, pk);
                    const eg = ctx.createLinearGradient(0, -40, 0, 8);
                    eg.addColorStop(0, "#7a3e18");
                    eg.addColorStop(1, "#c47a3e");
                    ctx.fillStyle = eg;
                    ctx.beginPath();
                    ctx.moveTo(-15, 6);
                    ctx.quadraticCurveTo(-12, -30, 0, -42);
                    ctx.quadraticCurveTo(12, -30, 15, 6);
                    ctx.fill();
                    ctx.fillStyle = "#f2b8a0";
                    ctx.beginPath();
                    ctx.moveTo(-8, 4);
                    ctx.quadraticCurveTo(-6, -22, 0, -30);
                    ctx.quadraticCurveTo(6, -22, 8, 4);
                    ctx.fill();
                    ctx.strokeStyle = "#4a2410";
                    ctx.lineWidth = 2;
                    for (let k = -2; k <= 2; k++) {
                        ctx.beginPath();
                        ctx.moveTo(k * 1.5, -40);
                        ctx.lineTo(k * 3, -52);
                        ctx.stroke();
                    }
                    ctx.restore();
                });
            }
            if (form >= 2) {
                // 얼굴 둘레에 털이 숭숭
                ctx.strokeStyle = "rgba(150,85,40,.85)";
                ctx.lineWidth = 2;
                for (let k = 0; k < 40; k++) {
                    const a  = Math.PI * 0.05 + (k / 40) * Math.PI * 0.9,
                          rx = (R + 8) * Math.cos(a),
                          ry = 4 + (R - 4) * Math.sin(a);
                    ctx.beginPath();
                    ctx.moveTo(rx * 0.93, ry * 0.93);
                    ctx.lineTo(
                        rx * 1.08 + Math.cos(a) * 3,
                        ry * 1.08 + Math.sin(a) * 5,
                    );
                    ctx.stroke();
                }
                ctx.fillStyle = "rgba(170,100,50,.18)";
                ctx.beginPath();
                ctx.ellipse(0, 6, R + 2, R - 4, 0, 0, Math.PI);
                ctx.fill();
            }
            drawHat(R, -R * 0.8);
            // 눈썹
            ctx.strokeStyle = "#4a2e1a";
            ctx.lineWidth = 3.2;
            const browTilt =
                      m === "hungry" || m === "cry" ? 1 : m === "full" ? -0.3 : 0;
            [-1, 1].forEach((sd) => {
                ctx.beginPath();
                ctx.moveTo(sd * 10, -16 - browTilt * 4);
                ctx.quadraticCurveTo(
                    sd * 18,
                    -20 - browTilt * 1,
                    sd * 26,
                    -17 + browTilt * 3,
                );
                ctx.stroke();
            });
            // 눈
            const blink = t % 3.4 < 0.12;
            const eyeClosed =
                      m === "full" || m === "cry" || (m === "eat" && chew > 0.5) || blink;
            [-1, 1].forEach((sd) => {
                const ex = sd * 18,
                      ey = -2;
                if (eyeClosed) {
                    ctx.strokeStyle = "#3a2416";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    if (m === "cry") {
                        ctx.moveTo(ex - 8, ey - 2);
                        ctx.lineTo(ex + 8, ey + 2 * sd * 0);
                        ctx.moveTo(ex - 8, ey + 3);
                        ctx.lineTo(ex + 8, ey);
                    } else ctx.arc(ex, ey + 3, 8, Math.PI * 1.15, Math.PI * 1.85);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, 9.5, 11, 0, 0, TAU);
                    ctx.fill();
                    const ig = ctx.createRadialGradient(ex, ey + 1, 1, ex, ey + 1, 8);
                    ig.addColorStop(0, "#2b1608");
                    ig.addColorStop(0.5, "#6b3d1c");
                    ig.addColorStop(1, "#3a1f0c");
                    const look = m === "idle" ? Math.sin(t * 0.7) * 1.5 : 0;
                    ctx.fillStyle = ig;
                    ctx.beginPath();
                    ctx.arc(ex + look, ey + 1.5, 7.5, 0, TAU);
                    ctx.fill();
                    ctx.fillStyle = "#0d0603";
                    ctx.beginPath();
                    ctx.arc(ex + look, ey + 1.5, 3.6, 0, TAU);
                    ctx.fill();
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(ex + look - 2.5, ey - 1.5, 2.6, 0, TAU);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex + look + 2.5, ey + 4, 1.2, 0, TAU);
                    ctx.fill();
                    ctx.strokeStyle = "#2a170b";
                    ctx.lineWidth = 2.6;
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, 9.5, 11, 0, Math.PI * 1.08, Math.PI * 1.92);
                    ctx.stroke();
                    ctx.lineWidth = 1.6;
                    [-1, 0, 1].forEach((k) => {
                        ctx.beginPath();
                        ctx.moveTo(ex + k * 4 + sd * 2, ey - 10.5);
                        ctx.lineTo(ex + k * 5 + sd * 3, ey - 14);
                        ctx.stroke();
                    });
                    if (m === "hungry") {
                        ctx.fillStyle = "rgba(140,200,255,.8)";
                        ctx.beginPath();
                        ctx.ellipse(ex, ey + 9, 6, 2.5, 0, 0, TAU);
                        ctx.fill();
                    }
                }
            });
            // 코
            ctx.fillStyle = "rgba(210,130,100,.45)";
            ctx.beginPath();
            ctx.ellipse(-3, 14, 2.4, 1.8, 0, 0, TAU);
            ctx.ellipse(3, 14, 2.4, 1.8, 0, 0, TAU);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.4)";
            ctx.beginPath();
            ctx.arc(0, 10, 2.5, 0, TAU);
            ctx.fill();
            // 입
            const mouth = (open, wide = 1) => {
                ctx.fillStyle = "#7a2a22";
                ctx.beginPath();
                ctx.ellipse(0, 28, 9 * wide, open, 0, 0, TAU);
                ctx.fill();
                if (open > 5) {
                    ctx.fillStyle = "#e8737a";
                    ctx.beginPath();
                    ctx.ellipse(0, 28 + open * 0.5, 6 * wide, open * 0.45, 0, 0, TAU);
                    ctx.fill();
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(-5 * wide, 28 - open + 1, 10 * wide, 3);
                }
                ctx.strokeStyle = "#c96a62";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 28, 9 * wide, open, 0, 0, TAU);
                ctx.stroke();
            };
            if (m === "cry") mouth(14, 1.5);
            else if (m === "eat") {
                ctx.strokeStyle = "#a5443c";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-8, 28);
                ctx.quadraticCurveTo(0, 28 + chew * 5, 8, 28);
                ctx.stroke();
            } else if (m === "full") {
                ctx.strokeStyle = "#a5443c";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 22, 11, 0.2, Math.PI - 0.2);
                ctx.stroke();
            } else if (m === "hungry") {
                ctx.strokeStyle = "#a5443c";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-9, 31);
                ctx.quadraticCurveTo(0, 23, 9, 31);
                ctx.stroke();
            } else mouth(8 + Math.sin(t * 3) * 2); // 아~ 하고 기다림
            if (form >= 2 && m !== "cry") {
                ctx.fillStyle = "#fffaf0";
                ctx.strokeStyle = "#c9b9a0";
                ctx.lineWidth = 1;
                [
                    [-5.5, 0],
                    [0.5, 0],
                ].forEach(([ox]) => {
                    ctx.beginPath();
                    ctx.rect(ox, 25, 5, 9);
                    ctx.fill();
                    ctx.stroke();
                });
            }
            // 눈물
            if (m === "cry") {
                ctx.fillStyle = "rgba(120,190,255,.85)";
                [-1, 1].forEach((sd) => {
                    for (let k = 0; k < 3; k++) {
                        const p = (t * 1.6 + k / 3) % 1;
                        ctx.beginPath();
                        ctx.ellipse(sd * (22 + p * 10), 6 + p * 46, 3.5, 6, 0, 0, TAU);
                        ctx.fill();
                    }
                });
            }
            ctx.restore();
            // 배부를 때 하트
            if (m === "full")
                for (let k = 0; k < 3; k++) {
                    const p = (t * 0.6 + k / 3) % 1;
                    ctx.globalAlpha = 1 - p;
                    txt(
                        "❤",
                        x - 60 + k * 60,
                        y - 60 - p * 50,
                        18,
                        "#ff5c8a",
                        "center",
                        false,
                    );
                    ctx.globalAlpha = 1;
                }
            // 말풍선
            if (G && !G.mini) {
                const say =
                          m === "eat"
                              ? "냠냠!"
                              : m === "hungry"
                                  ? "배고파…"
                                  : m === "full"
                                      ? "배불러~"
                                      : m === "cry"
                                          ? "으앙~!"
                                          : "아~";
                ctx.font =
                    '900 14px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
                const tw = ctx.measureText(say).width + 18;
                ctx.fillStyle = "#fff";
                rr(x + 56, y - 64, tw, 28, 12);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 60, y - 40);
                ctx.lineTo(x + 74, y - 40);
                ctx.lineTo(x + 50, y - 28);
                ctx.fill();
                ctx.fillStyle = "#4e342e";
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                ctx.fillText(say, x + 65, y - 50);
            }
        }

        const DECO = {

        const SAY_DECO = {

        const ANIMALS = {

        function drawAnimal(kind, fat, deco) {
            const D = deco ? DECO[deco] : null;
            const A =
                      D && D.fur
                          ? {...ANIMALS[kind], fur: D.fur, belly: D.belly}
                          : ANIMALS[kind],
                  m = G ? G.mood : "idle",
                  t = performance.now() / 1000;
            const chew = G.chew > 0 ? Math.abs(Math.sin(t * 22)) : 0;
            const bounce =
                      G.kidBounce > 0 ? Math.sin((G.kidBounce / 0.25) * Math.PI) * 6 : 0;
            const pk =
                      G.poof > 0 ? 1 + Math.sin((1 - G.poof / 0.6) * Math.PI) * 0.25 : 1;
            const breathe = Math.sin(t * 2.2) * 2;
            const rb =
                      Math.min(132, A.base * (1 + fat * A.grow) * (D ? D.scale : 1)) * pk; // 몸 반지름: 먹을수록·진화할수록 커짐
            const x = W / 2 + (deco === "monster" ? rnd(-1, 1) * 1.5 : 0),
                  y = H - 40 - rb * 0.9 - bounce; // 몸 중심
            const roll = m === "full" ? Math.sin(t * 4) * 0.35 : 0; // 배불러서 데굴데굴
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(roll);
            const furG = (r) => {
                const g = ctx.createRadialGradient(
                    -r * 0.35,
                    -r * 0.4,
                    r * 0.1,
                    0,
                    0,
                    r * 1.05,
                );
                g.addColorStop(0, A.fur[0]);
                g.addColorStop(0.65, A.fur[1]);
                g.addColorStop(1, A.fur[2]);
                return g;
            };
            const furEdge = (rx, ry, n, len, col) => {
                ctx.strokeStyle = col;
                ctx.lineWidth = 1.6;
                for (let i = 0; i < n; i++) {
                    const a  = (i / n) * TAU,
                          ex = Math.cos(a) * rx,
                          ey = Math.sin(a) * ry;
                    ctx.beginPath();
                    ctx.moveTo(ex * 0.96, ey * 0.96);
                    ctx.lineTo(
                        ex + Math.cos(a + 0.3) * len,
                        ey + Math.sin(a + 0.3) * len,
                    );
                    ctx.stroke();
                }
            };
            // 뒤쪽 장식
            if (deco === "god") {
                ctx.save();
                ctx.rotate(t * 0.2);
                for (let k = 0; k < 12; k++) {
                    ctx.rotate(TAU / 12);
                    const g = ctx.createLinearGradient(0, 0, rb * 2.4, 0);
                    g.addColorStop(0, "rgba(255,236,150,.45)");
                    g.addColorStop(1, "rgba(255,236,150,0)");
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(rb * 2.4, -16);
                    ctx.lineTo(rb * 2.4, 16);
                    ctx.fill();
                }
                ctx.restore();
                [-1, 1].forEach((sd) => {
                    ctx.save();
                    ctx.scale(sd, 1);
                    ctx.rotate(Math.sin(t * 3) * 0.08);
                    for (let k = 0; k < 5; k++) {
                        ctx.fillStyle = k % 2 ? "#ffffff" : "#f3f6ff";
                        ctx.beginPath();
                        ctx.ellipse(
                            rb * (0.9 + k * 0.12),
                            -rb * (0.55 - k * 0.12),
                            rb * 0.55,
                            rb * 0.14,
                            -0.5 + k * 0.15,
                            0,
                            TAU,
                        );
                        ctx.fill();
                        ctx.strokeStyle = "rgba(180,190,220,.6)";
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                    ctx.restore();
                });
            }
            if (deco === "ultra" || deco === "monster") {
                ctx.strokeStyle =
                    deco === "ultra"
                        ? `rgba(255,235,59,${0.6 + Math.sin(t * 20) * 0.3})`
                        : `rgba(200,30,40,${0.45 + Math.sin(t * 9) * 0.2})`;
                ctx.lineWidth = deco === "ultra" ? 3 : 8;
                ctx.beginPath();
                for (let k = 0; k <= 36; k++) {
                    const a   = (k / 36) * TAU,
                          rr0 = rb * 1.25 + (k % 2 ? 14 : -4) + Math.sin(t * 15 + k) * 5;
                    const px = Math.cos(a) * rr0,
                          py = Math.sin(a) * rr0 * 0.95;
                    k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
                }
                ctx.stroke();
            }
            if (deco === "super" || deco === "king") {
                const cc =
                          deco === "super"
                              ? ["#e53935", "#8e0000"]
                              : ["#7b1fa2", "#3a0a52"];
                const g = ctx.createLinearGradient(0, -rb, 0, rb * 1.1);
                g.addColorStop(0, cc[0]);
                g.addColorStop(1, cc[1]);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(-rb * 0.7, -rb * 0.75);
                ctx.quadraticCurveTo(
                    -rb * 1.5,
                    rb * 0.3,
                    -rb * 1.2 + Math.sin(t * 4) * 8,
                    rb * 1.05,
                );
                for (let k = 0; k <= 6; k++)
                    ctx.lineTo(
                        -rb * 1.2 + k * rb * 0.4 + Math.sin(t * 4 + k) * 8,
                        rb * 1.05 + (k % 2 ? 10 : 0),
                    );
                ctx.quadraticCurveTo(rb * 1.5, rb * 0.3, rb * 0.7, -rb * 0.75);
                ctx.fill();
            }
            // 꼬리
            if (A.tail === "bushy")
                drawTail(rb * 0.55, -rb * 0.1, 0.55 + fat * 0.25, t);
            if (A.tail === "curl") {
                ctx.strokeStyle = A.fur[2];
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(rb * 0.95, rb * 0.1);
                ctx.bezierCurveTo(
                    rb * 1.3,
                    -rb * 0.05,
                    rb * 1.3,
                    rb * 0.35,
                    rb * 1.12,
                    rb * 0.3,
                );
                ctx.bezierCurveTo(
                    rb * 1.0,
                    rb * 0.25,
                    rb * 1.1,
                    rb * 0.1,
                    rb * 1.22,
                    rb * 0.14,
                );
                ctx.stroke();
            }
            // 몸통 (살이 붙을수록 옆으로 퍼짐)
            const bx = rb * (1 + fat * 0.12),
                  by = rb * (0.95 + breathe * 0.004);
            ctx.fillStyle = furG(rb);
            ctx.beginPath();
            ctx.ellipse(0, 0, bx, by, 0, 0, TAU);
            ctx.fill();
            furEdge(bx, by, 60, 6, "rgba(90,45,20,.35)");
            // 배 털
            const bg = ctx.createRadialGradient(
                -bx * 0.1,
                rb * 0.05,
                2,
                0,
                rb * 0.15,
                bx * 0.7,
            );
            bg.addColorStop(0, "#fff");
            bg.addColorStop(1, A.belly);
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.ellipse(0, rb * 0.18, bx * 0.62, by * 0.66, 0, 0, TAU);
            ctx.fill();
            if (fat > 0.3) {
                ctx.strokeStyle = "rgba(180,120,90,.35)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, rb * 0.25, bx * 0.25, 0.3, Math.PI - 0.3);
                ctx.stroke();
            } // 배꼽 주름
            if (deco === "super" || deco === "ultra") {
                ctx.save();
                ctx.translate(0, -rb * 0.15);
                ctx.fillStyle = "#ffd600";
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(22, -4);
                ctx.lineTo(0, 22);
                ctx.lineTo(-22, -4);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = "#c62828";
                ctx.lineWidth = 3;
                ctx.stroke();
                txt(
                    deco === "super" ? "S" : "⚡",
                    0,
                    1,
                    18,
                    "#c62828",
                    "center",
                    false,
                );
                ctx.restore();
            }
            if (deco === "monster") {
                ctx.fillStyle = "#3d0f1a";
                for (let k = -3; k <= 3; k++) {
                    const a = -Math.PI / 2 + k * 0.32;
                    ctx.beginPath();
                    ctx.moveTo(
                        Math.cos(a - 0.1) * bx * 0.98,
                        Math.sin(a - 0.1) * by * 0.98,
                    );
                    ctx.lineTo(Math.cos(a) * (bx + 26), Math.sin(a) * (by + 26));
                    ctx.lineTo(
                        Math.cos(a + 0.1) * bx * 0.98,
                        Math.sin(a + 0.1) * by * 0.98,
                    );
                    ctx.fill();
                }
            }
            // 발
            ctx.fillStyle = A.fur[2];
            [-1, 1].forEach((sd) => {
                ctx.beginPath();
                ctx.ellipse(sd * bx * 0.45, by * 0.9, 16, 9, 0, 0, TAU);
                ctx.fill();
            });
            // 앞발(먹을 때 씨를 쥐고 오물오물)
            const pawY = rb * 0.05 - (m === "eat" ? chew * 6 : 0);
            [-1, 1].forEach((sd) => {
                ctx.fillStyle = A.fur[1];
                ctx.beginPath();
                ctx.ellipse(sd * 14, pawY, 11, 9, 0, 0, TAU);
                ctx.fill();
                ctx.fillStyle = "rgba(255,190,180,.7)";
                ctx.beginPath();
                ctx.arc(sd * 14, pawY + 2, 3, 0, TAU);
                ctx.fill();
            });
            if (m === "eat") {
                ctx.fillStyle = "#f3e2b8";
                ctx.beginPath();
                ctx.ellipse(0, pawY - 4, 6, 10, 0, 0, TAU);
                ctx.fill();
            }
            // 머리 (몸 위에 붙음)
            const hr = 40 + fat * 8,
                  hy = -by * 0.85;
            ctx.save();
            ctx.translate(0, hy);
            // 귀
            [-1, 1].forEach((sd) => {
                ctx.save();
                ctx.translate(sd * hr * 0.62, -hr * 0.72);
