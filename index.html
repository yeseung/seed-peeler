<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>씨 발라먹기</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #3e2a1e;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        }

        #wrap {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="c"></canvas>
</div>
<script>
    (() => {
        "use strict";
        const cv = document.getElementById("c");
        let ctx = cv.getContext("2d");
        const W = 360;
        let H     = 680,
            scale = 1;

        function resize() {
            const vw = innerWidth,
                  vh = innerHeight;
            H = Math.round(Math.max(600, Math.min(800, (W * vh) / vw)));
            scale = Math.min(vw / W, vh / H);
            const dpr = Math.min(devicePixelRatio || 1, 2);
            cv.style.width = W * scale + "px";
            cv.style.height = H * scale + "px";
            cv.width = Math.round(W * scale * dpr);
            cv.height = Math.round(H * scale * dpr);
            ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
        }

        addEventListener("resize", resize);
        resize();
        const rnd = (a, b) => a + Math.random() * (b - a);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const TAU = Math.PI * 2;

        // ================= 저장 =================
        const SAVE_KEY = "ssi_save_v2";
        const SV = {
            lv     : 0,
            path   : null,
            coins  : 0,
            best   : 0,
            endBest: 0,
            seen   : {},
            dex    : {},
            hats   : {none: 1},
            hat    : "none",
            day    : "",
            streak : 0,
            mDay   : "",
            mProg  : 0,
            mDone  : false,
            bank   : 0,
            e2lv   : 0,
            e2intro: false,
            opt    : {sound: true, vib: true, shake: true},
        };
        try {
            const o = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
            if (o) {
                const opt = Object.assign({}, SV.opt, o.opt || {});
                Object.assign(SV, o);
                SV.opt = opt;
            } else {
                SV.lv = +localStorage.getItem("seed_level") || 0;
                SV.best = +localStorage.getItem("seed_best") || 0;
            }
        } catch (e) {
        }

        function save() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(SV));
            } catch (e) {
            }
        }

        function dayStr(off = 0) {
            const d = new Date(Date.now() + off * 864e5);
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }

        let pendingDaily = 0;
        (function daily() {
            const today = dayStr();
            if (SV.day !== today) {
                SV.streak = SV.day === dayStr(-1) ? Math.min(7, SV.streak + 1) : 1;
                pendingDaily = 20 + SV.streak * 5;
            }
            if (SV.mDay !== today) {
                SV.mDay = today;
                SV.mProg = 0;
                SV.mDone = false;
            }
        })();
        const MISSION_N    = 30,
              MISSION_COIN = 50,
              REVIVE_COST  = 40;

        // ================= 소리 (설정 반영) =================
        let ac = null,
            nb = null;

        function A() {
            if (!ac) {
                ac = new (window.AudioContext || window.webkitAudioContext)();
                nb = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate);
                const d = nb.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            return ac;
        }

        function tone(f, d, type = "square", v = 0.05, slide = 0) {
            if (!SV.opt.sound) return;
            try {
                const a = A(),
                      o = a.createOscillator(),
                      g = a.createGain();
                o.type = type;
                o.frequency.value = f;
                if (slide)
                    o.frequency.linearRampToValueAtTime(
                        Math.max(30, f + slide),
                        a.currentTime + d,
                    );
                g.gain.value = v;
                g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
                o.connect(g);
                g.connect(a.destination);
                o.start();
                o.stop(a.currentTime + d);
            } catch (e) {
            }
        }

        function noise(d, f, v, q = 1) {
            if (!SV.opt.sound) return;
            try {
                const a  = A(),
                      s  = a.createBufferSource(),
                      fl = a.createBiquadFilter(),
                      g  = a.createGain();
                s.buffer = nb;
                fl.type = "bandpass";
                fl.frequency.value = f;
                fl.Q.value = q;
                g.gain.value = v;
                g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
                s.connect(fl);
                fl.connect(g);
                g.connect(a.destination);
                s.start();
                s.stop(a.currentTime + d);
            } catch (e) {
            }
        }

        const snd = {
            crack: () => {
                noise(0.08, 1800, 0.25, 2);
                noise(0.04, 5000, 0.12, 3);
                tone(160, 0.08, "square", 0.05, -60);
            },
            creak: () => noise(0.05, 900, 0.05, 3),
            split: () => {
                noise(0.06, 3500, 0.2, 2);
                tone(500, 0.1, "triangle", 0.05, 300);
            },
            fly  : () => noise(0.15, 2500, 0.06, 0.7),
            eat  : (c = 1) => {
                const b = 420 + Math.min(c, 12) * 45;
                tone(b, 0.07, "sine", 0.07, 200);
                setTimeout(() => tone(b + 200, 0.09, "sine", 0.07, 200), 80);
            },
            burp : () => tone(110, 0.35, "sawtooth", 0.07, -40),
            fever: () =>
                [0, 80, 160, 240, 320].forEach((d, i) =>
                    setTimeout(() => tone(700 + i * 120, 0.09, "square", 0.05), d),
                ),
            cry  : () => {
                tone(600, 0.5, "triangle", 0.06, -200);
                setTimeout(() => tone(560, 0.6, "triangle", 0.06, -220), 550);
            },
            win  : () =>
                [523, 659, 784, 1046].forEach((f, i) =>
                    setTimeout(() => tone(f, 0.18, "triangle", 0.08), i * 110),
                ),
            coin : () => {
                tone(1200, 0.06, "square", 0.04);
                setTimeout(() => tone(1600, 0.1, "square", 0.04), 60);
            },
            boom : () => {
                noise(0.4, 200, 0.4, 0.6);
                tone(80, 0.4, "sawtooth", 0.1, -40);
            },
            yuck : () => tone(180, 0.3, "sawtooth", 0.07, -90),
            ui   : () => tone(700, 0.04, "square", 0.03),
            ice  : () => noise(0.05, 6000, 0.05, 2),
        };

        function buzz(ms) {
            if (!SV.opt.vib) return;
            try {
                navigator.vibrate && navigator.vibrate(ms);
            } catch (e) {
            }
        }

        // ================= 씨앗 =================
        const SEEDS = {
            sun     : {
                name  : "해바라기씨",
                w     : 210,
                h     : 470,
                steps : [{a: "split"}],
                pieces: "lr",
                kernel: "#f3e2b8",
                food  : 5,
            },
            walnut  : {
                name  : "호두",
                w     : 310,
                h     : 325,
                steps : [{a: "squeeze", n: 3}, {a: "pick"}],
                pieces: "quad",
                kernel: "#c8955b",
                food  : 16,
            },
            peanut  : {
                name  : "땅콩",
                w     : 230,
                h     : 450,
                steps : [{a: "squeeze", n: 1}, {a: "pick"}],
                pieces: "tb",
                kernel: "#c0563f",
                food  : 8,
            },
            pista   : {
                name  : "피스타치오",
                w     : 260,
                h     : 410,
                steps : [{a: "split"}],
                pieces: "lr",
                kernel: "#8bc34a",
                food  : 7,
            },
            pumpkin : {
                name  : "호박씨",
                w     : 250,
                h     : 430,
                steps : [{a: "split"}],
                pieces: "lr",
                kernel: "#7cb342",
                food  : 6,
            },
            chestnut: {
                name  : "밤",
                w     : 280,
                h     : 300,
                steps : [{a: "squeeze", n: 2}, {a: "pick"}],
                pieces: "tb",
                kernel: "#f1d98a",
                food  : 10,
            },
            coconut : {
                name  : "코코넛",
                w     : 330,
                h     : 345,
                steps : [{a: "squeeze", n: 5}, {a: "pick"}],
                pieces: "quad",
                kernel: "#fbf8ef",
                food  : 30,
            },
        };
        const SHELLC = {
            sun     : ["#222", "#ddd"],
            walnut  : ["#8a6238", "#b88a55"],
            peanut  : ["#d8b981", "#b8955e"],
            pista   : ["#e8d6b0", "#c9b088"],
            pumpkin : ["#f5f0dc", "#d9cfa8"],
            chestnut: ["#5a2e14", "#8a5230"],
            coconut : ["#6b4423", "#a0703f"],
        };
        const MAXL = 50;

        // 단계 설정: 갈수록 배가 빨리 꺼지고 껍질이 단단해지고 방해 씨가 늘어남. 10단계마다 보스
        function LV(i) {
            const L    = i + 1,
                  boss = L % 10 === 0;
            let pool;
            if (boss)
                pool =
                    L >= 30
                        ? ["coconut", "coconut", "walnut", "chestnut"]
                        : ["coconut", "coconut", "walnut"];
            else if (L <= 2) pool = ["sun"];
            else if (L <= 4) pool = ["sun", "pumpkin"];
            else if (L <= 6) pool = ["sun", "pumpkin", "pista"];
            else if (L <= 9) pool = ["walnut", "sun", "pista"];
            else if (L <= 14)
                pool = ["peanut", "sun", "pista", "walnut", "pumpkin"];
            else if (L <= 19)
                pool = ["chestnut", "peanut", "walnut", "sun", "pista"];
            else
                pool = [
                    "sun",
                    "pumpkin",
                    "pista",
                    "walnut",
                    "peanut",
                    "chestnut",
                ].concat(L >= 31 ? ["coconut"] : []);
            return {
                L,
                boss,
                pool,
                time   : boss ? 75 : 60,
                drain  : DRAIN0 + L * DRAIN_K - (boss ? 0.15 : 0),
                hard   : Math.min(1.45, 1 + (L - 1) * 0.01),
                foodMul: Math.max(0.6, 0.87 - L * 0.008),
                gold   : L >= 12 ? 0.07 : 0,
                rotten : L >= 6 && !boss ? Math.min(0.15, 0.07 + L * 0.002) : 0,
                bomb   : L >= 16 ? 0.09 : 0,
                frozen : L >= 24 ? 0.09 : 0,
                title  : boss ? `Lv.${L} 보스` : `Lv.${L}`,
                banner : boss ? `Lv.${L} 보스! 거대 코코넛` : `Lv.${L}`,
            };
        }

        const DRAIN0  = 1.0,
              DRAIN_K = 0.02;

        function endlessCfg(el) {
            // 무한 모드: 시간이 갈수록 빨라짐
            return {
                L      : Math.min(50, 6 + Math.floor(el / 6)),
                boss   : false,
                pool   : [
                    "sun",
                    "pumpkin",
                    "pista",
                    "walnut",
                    "peanut",
                    "chestnut",
                ].concat(el > 60 ? ["coconut"] : []),
                drain  : 1.2 + el * 0.03,
                hard   : Math.min(1.45, 1 + el * 0.004),
                foodMul: 0.8,
                gold   : 0.08,
                rotten : 0.12,
                bomb   : el > 20 ? 0.1 : 0,
                frozen : el > 40 ? 0.1 : 0,
                title  : "무한 모드",
            };
        }

        function squeezeN(key, L) {
            return key === "walnut"
                ? 3 + Math.floor(L / 20)
                : key === "chestnut"
                    ? 2 + Math.floor(L / 25)
                    : key === "coconut"
                        ? 5 + Math.floor(L / 15)
                        : 1;
        }

        const HOWTO = {
            sun     : ["두 손가락을 씨 위에 대고", "양쪽으로 쫙 벌려요!"],
            pumpkin : ["두 손가락을 씨 위에 대고", "양쪽으로 쫙 벌려요!"],
            pista   : ["벌어진 틈에 손가락을 대고", "양쪽으로 쫙 벌려요!"],
            walnut  : [
                "① 두 손가락으로 꽉 눌러 금 내기",
                "② 껍질 조각을 끌어서 떼기",
            ],
            peanut  : ["① 꽉 눌러서 딱!", "② 위아래 껍질을 끌어서 떼기"],
            chestnut: ["① 꽉 눌러서 껍질 깨기", "② 위아래 껍질을 끌어서 떼기"],
            coconut : ["① 여러 번 꽉꽉 눌러 금 내기", "② 조각 4개를 끌어서 떼기"],
            rotten  : [
                "먹이면 배탈! 시간이 다 되기 전에",
                "한 손가락으로 옆으로 휙 버려요!",
            ],
            bomb    : ["심지가 다 타기 전에", "빨리 까야 해요! 터지면 배가 꺼져요"],
            frozen  : ["꽁꽁 얼었어요!", "손가락으로 쓱쓱 문질러 녹인 뒤 까요"],
            gold    : ["반짝이는 황금 씨!", "까면 알맹이가 3배!"],
        };
        const MODNAME = {
            rotten: "썩은 씨",
            bomb  : "폭탄 씨",
            frozen: "언 씨",
            gold  : "황금 씨",
        };

        function piecesFor(kind) {
            if (kind === "lr")
                return [
                    {a0: Math.PI / 2, a1: Math.PI * 1.5, dir: -1},
                    {a0: -Math.PI / 2, a1: Math.PI / 2, dir: 1},
                ];
            if (kind === "tb")
                return [
                    {a0: Math.PI, a1: TAU, dir: -1},
                    {a0: 0, a1: Math.PI, dir: 1},
                ];
            return [0, 1, 2, 3].map((i) => ({
                a0 : (i * Math.PI) / 2 - Math.PI / 4,
                a1 : ((i + 1) * Math.PI) / 2 - Math.PI / 4,
                dir: i,
            }));
        }

        // ================= 진화 (갈림길: 돼지의 길 / 곰의 길) =================
        const BASE_FORMS = [
            {
                lv   : 1,
                id   : "h0",
                name : "사람",
                h    : 0,
                story: "씨 까기를 좋아하는 아이. 오늘도 씨를 까 먹는데…",
            },
            {
                lv   : 2,
                id   : "h1",
                name : "다람쥐 귀",
                h    : 1,
                story: "어? 머리가 간질간질… 귀가 쫑긋 나왔다!",
            },
            {
                lv   : 3,
                id   : "h2",
                name : "털·앞니",
                h    : 2,
                story: "털이 숭숭, 앞니가 쑥! 뭔가 이상하다…",
            },
            {
                lv   : 4,
                id   : "h3",
                name : "꼬리",
                h    : 3,
                story: "엉덩이에서 복슬복슬한 꼬리까지?!",
            },
            {
                lv   : 5,
                id   : "sq",
                name : "다람쥐",
                kind : "squirrel",
                story: "뿅! 완전히 다람쥐가 되어 버렸다!",
            },
            {
                lv   : 9,
                id   : "ha",
                name : "햄스터",
                kind : "hamster",
                story: "볼주머니가 쭉쭉… 햄스터로 진화!",
            },
        ];
        const PATHS = {
            pig : {kind: "pig", n: "돼지", cry: "꿀꿀"},
            bear: {kind: "bear", n: "곰", cry: "으르렁"},
        };
        const TIERS = [
            {
                lv   : 15,
                deco : null,
                name : (n) => n,
                story: (P) => `너무 먹었나? ${P.cry}! ${P.n}이(가) 됐다!`,
            },
            {
                lv   : 21,
                deco : "super",
                name : (n) => "슈퍼 " + n,
                story: (P) => `씨의 힘이 넘친다! 망토 펄럭, 슈퍼 ${P.n}!`,
            },
            {
                lv   : 28,
                deco : "ultra",
                name : (n) => "울트라 " + n,
                story: (P) => `번쩍번쩍! 울트라 ${P.n}(으)로 각성했다!`,
            },
            {
                lv   : 36,
                deco : "monster",
                name : (n) => "괴물 " + n,
                story: (P) => `크아앙! 멈출 수 없는 식욕… 괴물 ${P.n} 출현!`,
            },
            {
                lv   : 43,
                deco : "king",
                name : (n) => "우주 " + n + " 킹",
                story: (P) => `지구의 씨로는 부족해! 우주 ${P.n} 킹 등극!`,
            },
            {
                lv   : 50,
                deco : "god",
                name : (n) => "전설의 " + n + "신",
                story: (P) => `모든 씨를 다스리는 전설의 ${P.n}신이 깨어났다!`,
            },
        ];

        function tierForms(path) {
            const P = PATHS[path];
            return TIERS.map((T, i) => ({
                lv   : T.lv,
                id   : path + i,
                kind : P.kind,
                deco : T.deco,
                name : T.name(P.n),
                story: T.story(P),
            }));
        }

        function formsFor(path) {
            return BASE_FORMS.concat(tierForms(path || "pig"));
        }

        const DEX_ALL = BASE_FORMS.concat(tierForms("pig"), tierForms("bear"));
        let FORMS = formsFor(SV.path);

        function formIdx(L) {
            let f = 0;
            FORMS.forEach((F, i) => {
                if (L >= F.lv) f = i;
            });
            return f;
        }

        function tierProg(L, f) {
            const a = FORMS[f].lv,
                  b = f + 1 < FORMS.length ? FORMS[f + 1].lv : a + 1;
            return clamp((L - a) / Math.max(1, b - a), 0, 1);
        }

        function markDex(f) {
            const id = FORMS[f].id;
            if (!SV.dex[id]) {
                SV.dex[id] = 1;
                save();
            }
        }

        const HATS = [
            ["none", "없음", 0],
            ["straw", "밀짚모자", 60],
            ["chef", "요리사 모자", 150],
            ["party", "고깔모자", 250],
            ["ribbon", "왕리본", 400],
        ];

        // ================= 상태 =================
        let state    = "title",
            S        = 0,
            G        = null,
            skipTut  = false,
            resetAsk = 0,
            lastBtnT = 0;
        const DUM = {
            mood     : "idle",
            chew     : 0,
            kidBounce: 0,
            poof     : 0,
            belly    : 50,
            mini     : true,
            form     : 0,
        };
        const pops = [],
              fx   = [],
              btns = [];
        let trauma  = 0,
            hitstop = 0,
            slowmo  = 0;

        function addTrauma(v) {
            trauma = Math.min(1, trauma + v);
        }

        function cx() {
            return W / 2;
        }

        function cy() {
            return 64 + (H - 214) / 2;
        }

        function pop(text, x, y, color = "#fff", size = 24, life = 1) {
            pops.push({text, x, y, color, size, life, max: life});
        }

        function shards(x, y, key, n) {
            const c = SHELLC[key] || ["#999", "#666"];
            for (let i = 0; i < n; i++) {
                const a  = rnd(0, TAU),
                      sp = rnd(150, 420);
                fx.push({
                    x    : x + rnd(-40, 40),
                    y    : y + rnd(-60, 60),
                    vx   : Math.cos(a) * sp,
                    vy   : Math.sin(a) * sp - 120,
                    life : rnd(0.5, 0.9),
                    color: c[i % 2],
                    r    : rnd(4, 9),
                    shard: true,
                    rot  : rnd(0, TAU),
                    vr   : rnd(-12, 12),
                });
            }
        }

        function bits(x, y, color, n = 8) {
            for (let i = 0; i < n; i++) {
                const a = rnd(0, TAU),
                      s = rnd(60, 240);
                fx.push({
                    x,
                    y,
                    vx  : Math.cos(a) * s,
                    vy  : Math.sin(a) * s - 60,
                    life: rnd(0.3, 0.7),
                    color,
                    r   : rnd(2, 5),
                });
            }
        }

        function cfg() {
            return G.endless ? endlessCfg(G.el) : G.cfg;
        }

        function newSeed() {
            const st  = cfg(),
                  key = st.pool[Math.floor(Math.random() * st.pool.length)],
                  d   = SEEDS[key];
            let steps = d.steps.map((x) =>
                x.a === "squeeze" ? {...x, n: squeezeN(key, st.L)} : x,
            );
            const r = Math.random();
            let mod = null,
                acc = 0;
            for (const m of ["rotten", "bomb", "frozen", "gold"]) {
                acc += st[m] || 0;
                if (r < acc) {
                    mod = m;
                    break;
                }
            }
            let timer = 0;
            if (mod === "rotten") {
                steps = [{a: "toss"}];
                timer = 4.5;
            }
            if (mod === "bomb")
                timer =
                    5 +
                    steps.reduce(
                        (s, x) =>
                            s +
                            (x.a === "squeeze" ? x.n * 1.1 : x.a === "pick" ? 2.5 : 0),
                        0,
                    );
            if (mod === "frozen") steps = [{a: "rub"}].concat(steps);
            G.seed = {
                key,
                d,
                steps,
                mod,
                gold      : mod === "gold",
                timer,
                timer0    : timer,
                hard      : st.hard,
                step      : 0,
                prog      : 0,
                rubAcc    : 0,
                squash    : 0,
                cracks    : 0,
                squeezeAcc: 0,
                rot       : rnd(-0.12, 0.12),
                spin      : 0,
                ox        : 0,
                oy        : 0,
                enter     : 1,
                pieces    : piecesFor(d.pieces).map((p) => ({
                    ...p,
                    dx  : 0,
                    dy  : 0,
                    r   : 0,
                    gone: false,
                    fly : null,
                })),
                crackLines: [],
                shake     : 0,
                done      : false,
            };
            G.idleT = 0;
            G.holdPiece = null;
            const tk = mod && !SV.seen[mod] ? mod : !SV.seen[key] ? key : null;
            if (tk && !skipTut) {
                G.tut = {
                    key,
                    mod  : tk === mod ? mod : null,
                    title: tk === mod ? MODNAME[mod] : d.name,
                    how  : HOWTO[tk],
                };
                SV.seen[tk] = 1;
                save();
            }
        }

        function startStage(s) {
            S = s;
            state = "play";
            const st   = LV(s),
                  prev = G && !G.endless && s > 0 ? G.score : 0,
                  f    = formIdx(st.L);
            G = {
                cfg      : st,
                endless  : false,
                el       : 0,
                form     : f,
                poof     : 0,
                T0       : st.time,
                t        : st.time,
                belly    : 25,
                peeled   : 0,
                combo    : 0,
                lastPeel : -9,
                food     : [],
                mood     : "idle",
                moodT    : 0,
                score    : prev,
                holdPiece: null,
                clock    : 0,
                banner   : {
                    text: st.banner,
                    sub : st.boss
                        ? "단단한 거대 코코넛! 꽉꽉 눌러 깨부숴요!"
                        : FORMS[f].lv === st.L
                            ? FORMS[f].story
                            : `지금 모습: ${FORMS[f].name}`,
                    t   : 2.6,
                },
            };
            markDex(f);
            if (st.boss) {
                addTrauma(0.5);
                tone(90, 0.6, "sawtooth", 0.08, -30);
            }
            newSeed();
        }

        function startEndless() {
            state = "play";
            S = SV.lv;
            const f = formIdx(SV.lv + 1);
            G = {
                cfg      : null,
                endless  : true,
                el       : 0,
                form     : f,
                poof     : 0,
                T0       : 0,
                t        : 0,
                belly    : 60,
                peeled   : 0,
                combo    : 0,
                lastPeel : -9,
                food     : [],
                mood     : "idle",
                moodT    : 0,
                score    : 0,
                holdPiece: null,
                clock    : 0,
                banner   : {
                    text: "무한 모드",
                    sub : "배가 다 꺼질 때까지 몇 개나 깔 수 있을까?",
                    t   : 2.4,
                },
            };
            newSeed();
        }

        function goTitle() {
            state = "title";
            G = null;
            E = null;
            resetAsk = 0;
            pops.length = 0;
        }

        // ================= 입력 =================
        const ptrs = new Map();
        let pinchD  = null,
            singleR = null;

        function loc(e) {
            const r = cv.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) / scale,
                y: (e.clientY - r.top) / scale,
            };
        }

        cv.addEventListener(
            "pointerdown",
            (e) => {
                e.preventDefault();
                A();
                const p = loc(e);
                for (let i = btns.length - 1; i >= 0; i--) {
                    const b = btns[i];
                    if (
                        p.x >= b.x &&
                        p.x <= b.x + b.w &&
                        p.y >= b.y &&
                        p.y <= b.y + b.h
                    ) {
                        snd.ui();
                        lastBtnT = performance.now();
                        b.cb();
                        return;
                    }
                }
                if (state !== "play" || G.paused) return;
                if (G.tut) {
                    G.tut = null;
                    return;
                }
                try {
                    cv.setPointerCapture(e.pointerId);
                } catch (er) {
                }
                ptrs.set(e.pointerId, {x: p.x, y: p.y, sx: p.x, sy: p.y});
                pinchD = null;
                singleR = null;
                const sd  = G.seed,
                      act = sd.steps[sd.step];
                if (act && act.a === "pick" && ptrs.size === 1 && !sd.done) {
                    const ang = Math.atan2(p.y - cy(), p.x - cx()) - sd.rot;
                    const pc = sd.pieces.find(
                        (pc) => !pc.gone && !pc.fly && inWedge(ang, pc),
                    );
                    if (pc) {
                        G.holdPiece = {pc, ox: p.x - pc.dx, oy: p.y - pc.dy};
                        snd.creak();
                    }
                }
            },
            {passive: false},
        );
        cv.addEventListener("pointermove", (e) => {
            const q = ptrs.get(e.pointerId);
            if (!q || state !== "play" || G.paused || G.tut) return;
            const p   = loc(e),
                  mdx = p.x - q.x,
                  mdy = p.y - q.y;
            q.x = p.x;
            q.y = p.y;
            G.idleT = 0;
            const sd  = G.seed,
                  act = sd.steps[sd.step];
            if (!act || sd.done) return;
            if (act.a === "toss") {
                if (ptrs.size === 1 && Math.hypot(p.x - q.sx, p.y - q.sy) > 90)
                    doToss(p.x - q.sx, p.y - q.sy);
                return;
            }
            if (act.a === "rub") {
                sd.rubAcc += Math.hypot(mdx, mdy);
                sd.prog = Math.min(1, sd.rubAcc / (520 * sd.hard));
                if (Math.random() < 0.25) {
                    snd.ice();
                    fx.push({
                        x    : p.x,
                        y    : p.y,
                        vx   : rnd(-60, 60),
                        vy   : rnd(-80, 20),
                        life : 0.5,
                        color: "#e1f5fe",
                        r    : rnd(2, 5),
                    });
                }
                if (sd.prog >= 1) {
                    sd.step++;
                    sd.prog = 0;
                    pop("녹았다!", cx(), cy() - 40, "#b3e5fc", 28, 0.7);
                    buzz(30);
                    pinchD = null;
                    singleR = null;
                }
                return;
            }
            if (G.holdPiece && act.a === "pick") {
                const h = G.holdPiece;
                h.pc.dx = p.x - h.ox;
                h.pc.dy = p.y - h.oy;
                return;
            }
            let delta = 0,
                two   = false;
            if (ptrs.size >= 2) {
                const [a, b] = [...ptrs.values()];
                const d = Math.hypot(a.x - b.x, a.y - b.y);
                if (pinchD !== null) delta = d - pinchD;
                pinchD = d;
                two = true;
            } else {
                // 한 손가락: 씨 중심에서 멀어지면 벌리기, 가까워지면 오므리기 (힘은 절반)
                const r = Math.hypot(p.x - cx(), p.y - cy());
                if (singleR !== null) delta = (r - singleR) * 0.5;
                singleR = r;
            }
            if (act.a === "split" && delta > 0) {
                sd.prog = Math.min(
                    1,
                    sd.prog + delta / ((two ? 150 : 170) * sd.hard),
                );
                if (Math.random() < 0.2) snd.creak();
                if (sd.prog >= 1) doSplit();
            }
            if (act.a === "squeeze" && delta < 0) {
                sd.squeezeAcc += -delta;
                sd.shake = 0.15;
                sd.squash = Math.min(0.14, sd.squash + -delta * 0.004);
                if (sd.squeezeAcc > (two ? 70 : 90) * sd.hard) {
                    sd.squeezeAcc = 0;
                    sd.cracks++;
                    snd.crack();
                    buzz(60);
                    sd.shake = 0.3;
                    addTrauma(0.35);
                    hitstop = 0.06;
                    shards(cx(), cy(), sd.key, 5);
                    addCrack(sd);
                    bits(cx(), cy(), "#6d4c41", 6);
                    pop(
                        sd.cracks >= act.n ? "쩍!" : "빠직!",
                        cx(),
                        cy() - 40,
                        "#fff",
                        30,
                        0.6,
                    );
                    if (sd.cracks >= act.n) {
                        sd.step++;
                        sd.prog = 0;
                    }
                }
            }
        });

        function endPtr(e) {
            if (!ptrs.has(e.pointerId)) return;
            ptrs.delete(e.pointerId);
            pinchD = null;
            singleR = null;
            if (state !== "play" || !G) return;
            const h = G.holdPiece;
            if (h) {
                G.holdPiece = null;
                if (Math.hypot(h.pc.dx, h.pc.dy) > 70) {
                    h.pc.fly = {
                        vx: h.pc.dx * 6,
                        vy: h.pc.dy * 6 - 100,
                        vr: rnd(-6, 6),
                    };
                    snd.fly();
                    buzz(25);
                    addTrauma(0.15);
                    shards(cx() + h.pc.dx, cy() + h.pc.dy, G.seed.key, 3);
                    checkPicked();
                } else {
                    h.pc.dx = 0;
                    h.pc.dy = 0;
                }
            }
        }

        cv.addEventListener("pointerup", endPtr);
        cv.addEventListener("pointercancel", endPtr);

        function inWedge(a, pc) {
            let x = a;
            while (x < pc.a0) x += TAU;
            while (x >= pc.a0 + TAU) x -= TAU;
            return x < pc.a1;
        }

        function addCrack(sd) {
            const pts = [];
            let x = rnd(-0.3, 0.3) * sd.d.w * 0.5,
                y = -sd.d.h * 0.4;
            for (let i = 0; i < 7; i++) {
                pts.push([x, y]);
                x += rnd(-18, 18);
                y += sd.d.h * 0.12;
            }
            sd.crackLines.push(pts);
        }

        function nextSeedSoon(sd, ms) {
            setTimeout(() => {
                if (state === "play" && G && G.seed === sd) newSeed();
            }, ms);
        }

        function doToss(dx, dy) {
            const sd = G.seed,
                  n  = Math.hypot(dx, dy) || 1;
            sd.done = true;
            sd.tossV = {x: (dx / n) * 1100, y: (dy / n) * 1100};
            snd.fly();
            buzz(30);
            G.score += 20;
            pop("휙! 잘 버렸다 +20", cx(), cy() - 60, "#c5e1a5", 24, 0.8);
            nextSeedSoon(sd, 260);
        }

        function doSplit() {
            const sd = G.seed;
            snd.split();
            buzz(50);
            addTrauma(0.45);
            hitstop = 0.08;
            shards(cx(), cy(), sd.key, 10);
            sd.pieces.forEach((pc) => {
                const a = (pc.a0 + pc.a1) / 2;
                pc.fly = {
                    vx: Math.cos(a) * 420,
                    vy: Math.sin(a) * 420 - 150,
                    vr: (pc.dir > 0 ? 1 : -1) * 5,
                };
            });
            pop("쫙!", cx(), cy() - 60, "#fff59d", 34, 0.6);
            peeled();
        }

        function checkPicked() {
            const sd = G.seed;
            if (!sd.done && sd.pieces.every((p) => p.gone || p.fly)) {
                pop("톡!", cx(), cy() - 60, "#fff59d", 30, 0.6);
                peeled();
            }
        }

        function peeled() {
            const sd = G.seed;
            sd.done = true;
            G.combo = G.clock - G.lastPeel < 3.5 ? G.combo + 1 : 1;
            G.lastPeel = G.clock;
            if (G.combo === 5) {
                snd.fever();
                pop("피버! 알맹이 2배", W / 2, H * 0.28, "#ff7043", 28, 1.4);
                addTrauma(0.2);
            }
            G.peeled++;
            if (!SV.mDone) {
                SV.mProg++;
                if (SV.mProg >= MISSION_N) {
                    SV.mDone = true;
                    SV.coins += MISSION_COIN;
                    snd.coin();
                    pop(
                        `오늘의 미션 달성! 코인 +${MISSION_COIN}`,
                        W / 2,
                        H * 0.34,
                        "#ffd54f",
                        20,
                        2,
                    );
                }
            }
            const c = cfg();
            setTimeout(() => {
                if (state !== "play" || !G || G.seed !== sd) return;
                G.food.push({
                    x    : cx(),
                    y    : cy(),
                    t    : -0.18,
                    color: sd.d.kernel,
                    val  :
                        sd.d.food *
                        c.foodMul *
                        (1 + 0.02 * SV.e2lv) *
                        (sd.gold ? 3 : 1) *
                        (G.combo >= 5 ? 2 : G.combo >= 3 ? 1.3 : 1),
                    key  : sd.key,
                });
                newSeed();
            }, 280);
        }

        // ================= 갱신 =================
        function update(rawDt) {
            let dt = rawDt;
            trauma = Math.max(0, trauma - rawDt * 1.8);
            if (hitstop > 0) {
                hitstop -= rawDt;
                dt = 0;
            } else if (slowmo > 0) {
                slowmo -= rawDt;
                dt = rawDt * 0.35;
            }
            pops.forEach((p) => {
                p.y -= 30 * rawDt;
                p.life -= rawDt;
            });
            for (let i = pops.length - 1; i >= 0; i--)
                if (pops[i].life <= 0) pops.splice(i, 1);
            fx.forEach((p) => {
                p.x += p.vx * rawDt;
                p.y += p.vy * rawDt;
                p.vy += 700 * rawDt;
                p.life -= rawDt;
                if (p.rot !== undefined) p.rot += p.vr * rawDt;
            });
            for (let i = fx.length - 1; i >= 0; i--)
                if (fx[i].life <= 0) fx.splice(i, 1);
            if (resetAsk > 0) resetAsk -= rawDt;
            if (state === "grow" || state === "growres") return e2Update(dt);
            if (state === "result") {
                G.resT += dt;
                if (G.poof > 0) G.poof -= dt;
                if (G.win && G.evolveTo !== undefined && !G.evolved && G.resT > 1) {
                    G.evolved = true;
                    G.form = G.evolveTo;
                    G.poof = 0.6;
                    addTrauma(0.6);
                    hitstop = 0.12;
                    markDex(G.form);
                    const mx = W / 2,
                          my = H - 150;
                    for (let k = 0; k < 40; k++) {
                        const a  = rnd(0, TAU),
                              sp = rnd(80, 340);
                        fx.push({
                            x    : mx + rnd(-40, 40),
                            y    : my + rnd(-40, 40),
                            vx   : Math.cos(a) * sp,
                            vy   : Math.sin(a) * sp - 80,
                            life : rnd(0.6, 1.2),
                            color: k % 3 ? "#ffffff" : "#ffe082",
                            r    : rnd(6, 16),
                        });
                    }
                    [0, 100, 200, 300].forEach((d, i) =>
                        setTimeout(
                            () => tone(400 + i * 200, 0.14, "triangle", 0.08, 300),
                            d,
                        ),
                    );
                }
                return;
            }
            if (state !== "play" || G.paused || G.tut) return;
            G.clock += dt;
            G.idleT = (G.idleT || 0) + dt;
            const c = cfg();
            if (G.endless) {
                G.el += dt;
                G.t = G.el;
            } else G.t -= dt;
            G.belly = Math.max(0, G.belly - c.drain * dt);
            if (G.banner) {
                G.banner.t -= dt;
                if (G.banner.t <= 0) G.banner = null;
            }
            G.moodT -= dt;
            if (G.moodT <= 0) G.mood = G.belly < 15 ? "hungry" : "idle";
            const sd = G.seed;
            if (sd.squash > 0) sd.squash = Math.max(0, sd.squash - dt * 0.5);
            if (G.poof > 0) G.poof -= dt;
            if (G.chew > 0) G.chew -= dt;
            if (G.kidBounce > 0) G.kidBounce -= dt;
            if (sd.enter > 0) sd.enter = Math.max(0, sd.enter - dt * 4);
            if (sd.shake > 0) sd.shake -= dt;
            if (sd.tossV) {
                sd.ox += sd.tossV.x * dt;
                sd.oy += sd.tossV.y * dt;
                sd.spin += dt * 9;
            }
            sd.pieces.forEach((pc) => {
                if (pc.fly) {
                    pc.dx += pc.fly.vx * dt;
                    pc.dy += pc.fly.vy * dt;
                    pc.fly.vy += 900 * dt;
                    pc.r += pc.fly.vr * dt;
                    if (pc.dy > H) pc.gone = true;
                }
            });
            if (!sd.done && sd.steps[sd.step] && sd.steps[sd.step].a === "split")
                sd.pieces.forEach((pc) => {
                    const a = (pc.a0 + pc.a1) / 2;
                    pc.dx = Math.cos(a) * sd.prog * 22;
                    pc.dy = Math.sin(a) * sd.prog * 22;
                });
            // 방해 씨 시간
            if (sd.timer0 > 0 && !sd.done && sd.enter <= 0) {
                sd.timer -= dt;
                if (sd.timer <= 0) {
                    sd.done = true;
                    if (sd.mod === "bomb") {
                        G.belly = Math.max(0, G.belly - 14);
                        snd.boom();
                        buzz(250);
                        addTrauma(0.9);
                        pop("펑! 배가 꺼졌다 -14", cx(), cy() - 40, "#ff8a80", 26, 1.1);
                        for (let k = 0; k < 30; k++) {
                            const a  = rnd(0, TAU),
                                  sp = rnd(120, 480);
                            fx.push({
                                x    : cx(),
                                y    : cy(),
                                vx   : Math.cos(a) * sp,
                                vy   : Math.sin(a) * sp,
                                life : rnd(0.4, 0.9),
                                color: k % 2 ? "#ff7043" : "#ffd54f",
                                r    : rnd(5, 14),
                            });
                        }
                        sd.ox = 9999;
                    } else {
                        G.belly = Math.max(0, G.belly - 10);
                        snd.yuck();
                        buzz(120);
                        G.mood = "cry";
                        G.moodT = 0.9;
                        pop(
                            "웩! 썩은 씨를 먹었다 -10",
                            W / 2,
                            H - 200,
                            "#c5e1a5",
                            22,
                            1.1,
                        );
                        sd.tossV = {x: 0, y: 900};
                    }
                    G.combo = 0;
                    nextSeedSoon(sd, 350);
                }
            }
            // 먹이 날아가기
            const mx = W / 2,
                  my = H - 92;
            for (let i = G.food.length - 1; i >= 0; i--) {
                const f = G.food[i];
                f.t += dt * (f.t < 0 ? 1 : 2.2);
                if (f.t >= 1) {
                    G.food.splice(i, 1);
                    G.belly = Math.min(100, G.belly + f.val);
                    const D = FORMS[G.form].deco;
                    if (D === "monster" || D === "god") {
                        addTrauma(0.18);
                        tone(70, 0.2, "sawtooth", 0.07, -20);
                    }
                    const pts = Math.round(f.val * 10 * (G.combo >= 3 ? 1.5 : 1));
                    G.score += pts;
                    G.mood = "eat";
                    G.moodT = 0.8;
                    G.chew = 0.8;
                    snd.eat(G.combo);
                    bits(mx, my - 10, "#fff3e0", 5);
                    G.kidBounce = 0.25;
                    pop(
                        G.combo >= 3 ? `냠냠! ${G.combo}연속 +${pts}` : `냠! +${pts}`,
                        mx,
                        my - 70,
                        "#fff",
                        20,
                        0.8,
                    );
                    if (!G.endless && G.belly >= 100) {
                        slowmo = 0.8;
                        return endStage(true, "배불러~!");
                    }
                }
            }
            if (G.belly <= 0)
                return endStage(
                    false,
                    G.endless ? "배가 다 꺼졌다!" : "배고파서 울어요…",
                );
            if (!G.endless && G.t <= 0)
                return endStage(false, "시간이 다 됐어요…");
        }

        function endStage(win, msg) {
            state = "result";
            G.win = win;
            G.msg = msg;
            G.resT = 0;
            G.mood = win ? "full" : "cry";
            ptrs.clear();
            G.holdPiece = null;
            if (win) {
                snd.win();
                G.score += Math.round(G.t * 20);
                setTimeout(() => {
                    snd.burp();
                    pop("꺼억~", W / 2 + 60, H - 190, "#fff", 26, 1.2);
                }, 900);
            } else snd.cry();
            G.near =
                !win && !G.endless && G.belly > 55 ? Math.ceil(100 - G.belly) : 0;
            G.coinGain = 0;
            if (G.endless) {
                G.coinGain = G.peeled;
                G.newBest = G.peeled > SV.endBest;
                SV.endBest = Math.max(SV.endBest, G.peeled);
            } else if (win) {
                G.stars = G.t / G.T0 >= 0.55 ? 3 : G.t / G.T0 >= 0.3 ? 2 : 1;
                G.coinGain = 10 + G.stars * 5 + (G.cfg.boss ? 20 : 0);
                SV.lv = Math.max(SV.lv, Math.min(S + 1, MAXL - 1));
                if (S + 1 < MAXL) {
                    if (S + 2 === 15 && !SV.path) G.choose = true;
                    else {
                        const nf = formIdx(S + 2);
                        if (nf !== G.form) G.evolveTo = nf;
                    }
                }
            }
            SV.bank += G.peeled;
            SV.coins += G.coinGain;
            SV.best = Math.max(SV.best, G.score);
            save();
            buzz(win ? 80 : 300);
        }

        function choosePath(p) {
            SV.path = p;
            FORMS = formsFor(p);
            save();
            G.choose = false;
            G.evolveTo = formIdx(15);
            G.resT = 0.6;
        }

        function revive() {
            if (SV.coins < REVIVE_COST || G.revived) return;
            SV.coins -= REVIVE_COST;
            save();
            G.revived = true;
            state = "play";
            G.t = Math.max(G.t, 0) + 15;
            G.belly = 45;
            G.mood = "idle";
            G.moodT = 0;
            snd.coin();
            pop("한 번 더! +15초", W / 2, H * 0.3, "#fff59d", 26, 1.2);
            if (G.seed.done) newSeed();
        }

        // ================= 그리기 =================
        function txt(
            s,
            x,
            y,
            size,
            color,
            align  = "center",
            stroke = true,
            w      = 900,
        ) {
            ctx.font = `${w} ${size}px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif`;
            ctx.textAlign = align;
            ctx.textBaseline = "middle";
            if (stroke) {
                ctx.lineWidth = Math.max(3, size / 6);
                ctx.strokeStyle = "rgba(40,22,10,.85)";
                ctx.lineJoin = "round";
                ctx.strokeText(s, x, y);
            }
            ctx.fillStyle = color;
            ctx.fillText(s, x, y);
        }

        function rr(x, y, w, h, r) {
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
            else ctx.rect(x, y, w, h);
        }

        // 씨 모양 경로
        function seedPath(key, w, h) {
            ctx.beginPath();
            if (key === "sun" || key === "pumpkin") {
                const top = -h / 2,
                      bot = h / 2;
                ctx.moveTo(0, top);
                ctx.bezierCurveTo(
                    w * 0.55,
                    top + h * 0.08,
                    w * 0.55,
                    bot - h * 0.2,
                    0,
                    bot,
                );
                ctx.bezierCurveTo(
                    -w * 0.55,
                    bot - h * 0.2,
                    -w * 0.55,
                    top + h * 0.08,
                    0,
                    top,
                );
            } else if (key === "walnut") {
                ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, TAU);
            } else if (key === "peanut") {
                ctx.ellipse(0, -h * 0.24, w * 0.5, h * 0.27, 0, 0, TAU);
                ctx.ellipse(0, h * 0.24, w * 0.47, h * 0.27, 0, 0, TAU);
            } else if (key === "pista" || key === "coconut") {
                ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, TAU);
            } else if (key === "chestnut") {
                ctx.moveTo(0, -h / 2);
                ctx.bezierCurveTo(
                    w * 0.25,
                    -h * 0.42,
                    w * 0.55,
                    -h * 0.05,
                    w * 0.5,
                    h * 0.25,
                );
                ctx.quadraticCurveTo(w * 0.42, h / 2, 0, h / 2);
                ctx.quadraticCurveTo(-w * 0.42, h / 2, -w * 0.5, h * 0.25);
                ctx.bezierCurveTo(
                    -w * 0.55,
                    -h * 0.05,
                    -w * 0.25,
                    -h * 0.42,
                    0,
                    -h / 2,
                );
            }
        }

        function drawShellRaw(key, w, h) {
            // 그림자
            ctx.save();
            ctx.translate(10, 14);
            seedPath(key, w, h);
            ctx.fillStyle = "rgba(60,30,10,.22)";
            ctx.fill();
            ctx.restore();
            seedPath(key, w, h);
            ctx.save();
            ctx.clip();
            if (key === "sun") {
                const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
                g.addColorStop(0, "#0d0d0d");
                g.addColorStop(0.45, "#3a3a3a");
                g.addColorStop(1, "#111");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                for (let i = -4; i <= 4; i++) {
                    const sx = i * w * 0.11;
                    const sg = ctx.createLinearGradient(sx - 6, 0, sx + 6, 0);
                    sg.addColorStop(0, "rgba(230,230,225,0)");
                    sg.addColorStop(0.5, "rgba(235,235,228,.95)");
                    sg.addColorStop(1, "rgba(230,230,225,0)");
                    ctx.strokeStyle = sg;
                    ctx.lineWidth = 6 + (i % 2 ? 2 : 0);
                    ctx.beginPath();
                    ctx.moveTo(sx * 0.3, -h / 2);
                    ctx.bezierCurveTo(
                        sx * 1.3,
                        -h * 0.2,
                        sx * 1.3,
                        h * 0.2,
                        sx * 0.6,
                        h / 2,
                    );
                    ctx.stroke();
                }
                ctx.fillStyle = "rgba(0,0,0,.35)";
                ctx.fillRect(-1.5, -h / 2, 3, h);
            } else if (key === "walnut") {
                const g = ctx.createRadialGradient(
                    -w * 0.2,
                    -h * 0.25,
                    10,
                    0,
                    0,
                    w * 0.62,
                );
                g.addColorStop(0, "#d8b07a");
                g.addColorStop(0.6, "#a87a45");
                g.addColorStop(1, "#6e4a24");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                // 이음선 양쪽으로 굽이치는 깊은 골(어두운 선)과 솟은 능선(밝은 선)
                for (let side = -1; side <= 1; side += 2)
                    for (let i = 0; i < 11; i++) {
                        const y0  = -h * 0.44 + i * h * 0.088,
                              amp = 6 + Math.abs(rnd0(i * 3 + side)) * 7,
                              ph  = rnd0(i + side * 20) * 3;
                        const line = (ox, oy) => {
                            ctx.beginPath();
                            for (let k = 0; k <= 16; k++) {
                                const tt = k / 16,
                                      xx = side * (6 + tt * w * 0.5),
                                      yy =
                                          y0 +
                                          Math.sin(tt * 9 + ph) * amp +
                                          tt * tt * (y0 / h) * 60;
                                k
                                    ? ctx.lineTo(xx + ox, yy + oy)
                                    : ctx.moveTo(xx + ox, yy + oy);
                            }
                            ctx.stroke();
                        };
                        ctx.strokeStyle = "rgba(60,35,12,.6)";
                        ctx.lineWidth = 5;
                        line(0, 2);
                        ctx.strokeStyle = "rgba(245,215,165,.35)";
                        ctx.lineWidth = 2;
                        line(-1, -3);
                    }
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = "rgba(60,35,12,.35)";
                    ctx.beginPath();
                    ctx.arc(
                        rnd0(i) * w * 0.42,
                        rnd0(i + 40) * h * 0.42,
                        1.5 + Math.abs(rnd0(i + 5)) * 2,
                        0,
                        TAU,
                    );
                    ctx.fill();
                }
                ctx.fillStyle = "rgba(60,35,12,.55)";
                ctx.fillRect(-4, -h / 2, 8, h);
                ctx.fillStyle = "rgba(230,200,150,.35)";
                ctx.fillRect(-7, -h / 2, 3, h);
            } else if (key === "peanut") {
                const g = ctx.createRadialGradient(
                    -w * 0.2,
                    -h * 0.2,
                    10,
                    0,
                    0,
                    h * 0.55,
                );
                g.addColorStop(0, "#ecd3a0");
                g.addColorStop(1, "#b8915a");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                ctx.strokeStyle = "rgba(130,92,45,.5)";
                ctx.lineWidth = 2.2;
                for (let x = -w; x < w; x += 15) {
                    ctx.beginPath();
                    ctx.moveTo(x, -h / 2);
                    for (let y = -h / 2; y < h / 2; y += 20)
                        ctx.lineTo(x + Math.sin(y * 0.05 + x) * 3, y);
                    ctx.stroke();
                }
                ctx.strokeStyle = "rgba(130,92,45,.35)";
                for (let y = -h / 2; y < h / 2; y += 14) {
                    ctx.beginPath();
                    ctx.moveTo(-w, y);
                    ctx.lineTo(w, y + 4);
                    ctx.stroke();
                }
                for (let i = 0; i < 60; i++) {
                    ctx.fillStyle = "rgba(120,85,40,.35)";
                    ctx.beginPath();
                    ctx.arc(rnd0(i) * w * 0.45, rnd0(i + 30) * h * 0.48, 2, 0, TAU);
                    ctx.fill();
                }
            } else if (key === "pista") {
                const g = ctx.createRadialGradient(
                    -w * 0.2,
                    -h * 0.25,
                    10,
                    0,
                    0,
                    h * 0.55,
                );
                g.addColorStop(0, "#f6e9cc");
                g.addColorStop(1, "#c9ae80");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = `rgba(170,120,70,${0.15 + Math.abs(rnd0(i)) * 0.25})`;
                    ctx.beginPath();
                    ctx.ellipse(
                        rnd0(i) * w * 0.42,
                        rnd0(i + 9) * h * 0.44,
                        6 + Math.abs(rnd0(i + 2)) * 8,
                        3,
                        rnd0(i + 4),
                        0,
                        TAU,
                    );
                    ctx.fill();
                }
                // 벌어진 틈 사이로 보이는 초록 알맹이
                ctx.fillStyle = "#6a9f2e";
                ctx.beginPath();
                ctx.ellipse(0, -h * 0.28, 6, h * 0.17, 0, 0, TAU);
                ctx.fill();
                ctx.strokeStyle = "#7b5e3f";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-5, -h / 2);
                ctx.lineTo(-6, -h * 0.1);
                ctx.moveTo(5, -h / 2);
                ctx.lineTo(6, -h * 0.1);
                ctx.stroke();
            } else if (key === "pumpkin") {
                const g = ctx.createRadialGradient(
                    -w * 0.15,
                    -h * 0.2,
                    10,
                    0,
                    0,
                    h * 0.55,
                );
                g.addColorStop(0, "#fffdf3");
                g.addColorStop(1, "#e2d8b5");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                ctx.strokeStyle = "rgba(200,185,140,.9)";
                ctx.lineWidth = 10;
                seedPath(key, w * 0.9, h * 0.93);
                ctx.stroke();
                ctx.strokeStyle = "rgba(255,255,255,.7)";
                ctx.lineWidth = 3;
                seedPath(key, w * 0.82, h * 0.86);
                ctx.stroke();
            }
            if (key === "chestnut") {
                const g = ctx.createRadialGradient(
                    -w * 0.2,
                    -h * 0.25,
                    6,
                    0,
                    0,
                    h * 0.6,
                );
                g.addColorStop(0, "#a0602f");
                g.addColorStop(0.6, "#5e2f12");
                g.addColorStop(1, "#2e1406");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                ctx.strokeStyle = "rgba(30,12,4,.35)";
                ctx.lineWidth = 2;
                for (let k = -4; k <= 4; k++) {
                    ctx.beginPath();
                    ctx.moveTo(k * 12, -h / 2);
                    ctx.quadraticCurveTo(k * 34, 0, k * 26, h * 0.3);
                    ctx.stroke();
                }
                const bg = ctx.createLinearGradient(0, h * 0.2, 0, h / 2);
                bg.addColorStop(0, "rgba(210,180,130,0)");
                bg.addColorStop(0.35, "#cdb08a");
                bg.addColorStop(1, "#a88a62");
                ctx.fillStyle = bg;
                ctx.fillRect(-w, h * 0.2, w * 2, h);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = "rgba(120,90,55,.5)";
                    ctx.beginPath();
                    ctx.arc(
                        rnd0(i) * w * 0.4,
                        h * 0.36 + rnd0(i + 4) * h * 0.1,
                        1.5,
                        0,
                        TAU,
                    );
                    ctx.fill();
                }
                ctx.fillStyle = "#d8c39a";
                ctx.beginPath();
                ctx.moveTo(-6, -h / 2 + 4);
                ctx.lineTo(0, -h / 2 - 16);
                ctx.lineTo(6, -h / 2 + 4);
                ctx.fill();
            } else if (key === "coconut") {
                const g = ctx.createRadialGradient(
                    -w * 0.2,
                    -h * 0.2,
                    10,
                    0,
                    0,
                    w * 0.6,
                );
                g.addColorStop(0, "#9a6a3c");
                g.addColorStop(0.6, "#6b4423");
                g.addColorStop(1, "#3b2311");
                ctx.fillStyle = g;
                ctx.fillRect(-w, -h, w * 2, h * 2);
                for (let i = 0; i < 160; i++) {
                    const a  = rnd0(i) * Math.PI,
                          r0 = Math.abs(rnd0(i + 3)) * w * 0.48,
                          x0 = Math.cos(a) * r0,
                          y0 = Math.sin(a) * r0;
                    ctx.strokeStyle =
                        i % 3 ? "rgba(60,35,15,.55)" : "rgba(190,150,100,.45)";
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.moveTo(x0, y0);
                    ctx.quadraticCurveTo(
                        x0 + rnd0(i + 7) * 14,
                        y0 + rnd0(i + 8) * 14,
                        x0 + rnd0(i + 9) * 24,
                        y0 + rnd0(i + 10) * 24,
                    );
                    ctx.stroke();
                }
                [
                    [-24, -h * 0.3],
                    [24, -h * 0.3],
                    [0, -h * 0.18],
                ].forEach(([ex, ey]) => {
                    ctx.fillStyle = "#2a170a";
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, 11, 13, 0, 0, TAU);
                    ctx.fill();
                    ctx.fillStyle = "rgba(255,255,255,.15)";
                    ctx.beginPath();
                    ctx.arc(ex - 3, ey - 4, 3, 0, TAU);
                    ctx.fill();
                });
            }
            // 광택 (빛 반사)
            const hl = ctx.createRadialGradient(
                -w * 0.22,
                -h * 0.25,
                2,
                -w * 0.22,
                -h * 0.25,
                w * 0.45,
            );
            hl.addColorStop(0, "rgba(255,255,255,.45)");
            hl.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = hl;
            ctx.fillRect(-w, -h, w * 2, h * 2);
            // 가장자리 어둡게(입체감)
            const vg = ctx.createRadialGradient(
                0,
                0,
                Math.min(w, h) * 0.3,
                0,
                0,
                Math.max(w, h) * 0.6,
            );
            vg.addColorStop(0, "rgba(0,0,0,0)");
            vg.addColorStop(1, "rgba(0,0,0,.35)");
            ctx.fillStyle = vg;
            ctx.fillRect(-w, -h, w * 2, h * 2);
            ctx.restore();
            seedPath(key, w, h);
            ctx.strokeStyle = "rgba(30,15,5,.45)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function rnd0(i) {
            const x = Math.sin(i * 91.7) * 43758.5;
            return (x - Math.floor(x)) * 2 - 1;
        }

        function drawKernel(key, w, h, color) {
            if (key === "coconut") {
                ctx.fillStyle = "#5a3a1c";
                ctx.beginPath();
                ctx.ellipse(0, 0, w * 0.4, h * 0.4, 0, 0, TAU);
                ctx.fill();
                const g = ctx.createRadialGradient(
                    -w * 0.1,
                    -h * 0.1,
                    4,
                    0,
                    0,
                    w * 0.36,
                );
                g.addColorStop(0, "#ffffff");
                g.addColorStop(1, "#efe9d8");
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, w * 0.36, h * 0.36, 0, 0, TAU);
                ctx.fill();
                ctx.fillStyle = "rgba(200,230,255,.5)";
                ctx.beginPath();
                ctx.ellipse(0, 0, w * 0.2, h * 0.2, 0, 0, TAU);
                ctx.fill();
                return;
            }
            if (key === "chestnut") {
                const g = ctx.createRadialGradient(
                    -w * 0.1,
                    -h * 0.1,
                    4,
                    0,
                    0,
                    w * 0.38,
                );
                g.addColorStop(0, "#fff3c4");
                g.addColorStop(1, "#e2c26a");
                ctx.fillStyle = g;
                seedPath("chestnut", w * 0.74, h * 0.74);
                ctx.fill();
                ctx.strokeStyle = "rgba(160,120,50,.5)";
                ctx.lineWidth = 3;
                for (let k = 0; k < 4; k++) {
                    ctx.beginPath();
                    ctx.moveTo(-w * 0.25, -h * 0.2 + k * h * 0.12);
                    ctx.quadraticCurveTo(
                        0,
                        -h * 0.26 + k * h * 0.12,
                        w * 0.25,
                        -h * 0.2 + k * h * 0.12,
                    );
                    ctx.stroke();
                }
                return;
            }
            const lighten = (c, a) => {
                const n = parseInt(c.slice(1), 16),
                      r = Math.min(255, (n >> 16) + a),
                      g = Math.min(255, ((n >> 8) & 255) + a),
                      b = Math.min(255, (n & 255) + a);
                return `rgb(${r},${g},${b})`;
            };
            const fillG = (rx, ry) => {
                const g = ctx.createRadialGradient(
                    -rx * 0.3,
                    -ry * 0.35,
                    2,
                    0,
                    0,
                    Math.max(rx, ry),
                );
                g.addColorStop(0, lighten(color, 60));
                g.addColorStop(0.7, color);
                g.addColorStop(1, lighten(color, -50));
                return g;
            };
            if (key === "walnut") {
                for (let i = 0; i < 4; i++) {
                    const ox = (i % 2 ? 1 : -1) * w * 0.17,
                          oy = (i < 2 ? -1 : 1) * h * 0.16;
                    ctx.save();
                    ctx.translate(ox, oy);
                    ctx.fillStyle = fillG(w * 0.17, h * 0.2);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, w * 0.17, h * 0.2, 0, 0, TAU);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(100,60,25,.55)";
                    ctx.lineWidth = 3;
                    for (let k = 0; k < 4; k++) {
                        ctx.beginPath();
                        ctx.moveTo(-w * 0.12, -h * 0.14 + k * h * 0.09);
                        ctx.bezierCurveTo(
                            -w * 0.04,
                            -h * 0.18 + k * h * 0.09,
                            w * 0.04,
                            -h * 0.1 + k * h * 0.09,
                            w * 0.12,
                            -h * 0.14 + k * h * 0.09,
                        );
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            } else if (key === "peanut") {
                [
                    [-h * 0.22, w * 0.33, h * 0.19],
                    [h * 0.22, w * 0.31, h * 0.19],
                ].forEach(([oy, rx, ry]) => {
                    ctx.save();
                    ctx.translate(0, oy);
                    ctx.fillStyle = fillG(rx, ry);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(80,20,10,.35)";
                    ctx.lineWidth = 1.5;
                    for (let k = 0; k < 5; k++) {
                        ctx.beginPath();
                        ctx.moveTo(-rx * 0.7, -ry * 0.6 + k * ry * 0.3);
                        ctx.lineTo(rx * 0.7, -ry * 0.5 + k * ry * 0.3);
                        ctx.stroke();
                    }
                    ctx.restore();
                });
            } else {
                const kw = w * 0.62,
                      kh = h * 0.7;
                seedPath(key === "pista" ? "pista" : "sun", kw, kh);
                ctx.fillStyle = fillG(kw / 2, kh / 2);
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,.12)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, -kh * 0.4);
                ctx.lineTo(0, kh * 0.4);
                ctx.stroke();
            }
            ctx.fillStyle = "rgba(255,255,255,.35)";
            ctx.beginPath();
            ctx.ellipse(-w * 0.09, -h * 0.14, w * 0.05, h * 0.09, -0.3, 0, TAU);
            ctx.fill();
        }

        // 껍질 그림은 한 번 그려 두고 재사용 (저사양 폰 끊김 방지)
        const shellCache = {};

        // ---- 진짜 같은 껍질: 높낮이 지도를 만들고 빛을 비춰 픽셀 단위로 그림 ----
        function hash2(x, y) {
            let h =
                    Math.imul(x | 0, 0x9e3779b1) ^
                    Math.imul((y | 0) + 0x7f4a7c15, 0x85ebca6b);
            h ^= h >>> 15;
            h = Math.imul(h, 0xc2b2ae35);
            h ^= h >>> 13;
            h = Math.imul(h, 0x27d4eb2f);
            h ^= h >>> 16;
            return (h >>> 0) / 4294967295;
        }

        function vnoise(x, y) {
            const xi = Math.floor(x),
                  yi = Math.floor(y),
                  xf = x - xi,
                  yf = y - yi,
                  u  = xf * xf * (3 - 2 * xf),
                  v  = yf * yf * (3 - 2 * yf);
            const a = hash2(xi, yi),
                  b = hash2(xi + 1, yi),
                  c = hash2(xi, yi + 1),
                  d = hash2(xi + 1, yi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }

        function fbm(x, y, o = 4) {
            let s = 0,
                a = 0.5,
                f = 1;
            for (let i = 0; i < o; i++) {
                s += a * vnoise(x * f, y * f);
                f *= 2.03;
                a *= 0.5;
            }
            return s / (1 - Math.pow(0.5, o));
        }

        const sstep = (a, b, x) => {
            const t = clamp((x - a) / (b - a), 0, 1);
            return t * t * (3 - 2 * t);
        };
        const mix3 = (A, B, t) => [
            A[0] + (B[0] - A[0]) * t,
            A[1] + (B[1] - A[1]) * t,
            A[2] + (B[2] - A[2]) * t,
        ];
        // 재질: (u, v: 씨 중심 기준 좌표, s: 가로 -1~1, dist: 가장자리까지 거리) → { c: 색, h: 잔굴곡 높이, sp: 광택 세기 }
        const MAT = {
            sun(u, v, s, dist, d) {
                const warp = (vnoise(u * 0.03 + 5, v * 0.006) - 0.5) * 0.16,
                      ss   = s + warp;
                const f  = Math.cos(ss * Math.PI * 4.4),
                      wh =
                          sstep(0.25, 0.8, f) *
                          (0.7 + 0.3 * vnoise(u * 0.2, v * 0.02)) *
                          sstep(1, 0.86, Math.abs(s));
                const fib  = vnoise(u * 1.1 + 3, v * 0.035),
                      fine = vnoise(u * 2.6, v * 0.12);
                let c = mix3([26, 24, 23], [226, 221, 208], wh);
                const k = 0.8 + 0.32 * fib + 0.1 * fine;
                c = [c[0] * k, c[1] * k, c[2] * k];
                return {
                    c,
                    h : wh * 1.4 + fib * 1.2 + fine * 0.5,
                    sp: 0.28 - wh * 0.15,
                };
            },
            pumpkin(u, v, s, dist, d) {
                const rim    = Math.exp(-Math.pow((dist - 9) / 5.5, 2)),
                      groove = Math.exp(-Math.pow((dist - 19) / 4, 2));
                const fib = vnoise(u * 0.7, v * 0.05),
                      bl  = fbm(u * 0.02 + 9, v * 0.02, 3);
                let c = mix3([243, 238, 212], [222, 214, 172], bl * 0.8);
                const k = (1 - 0.16 * groove) * (0.94 + 0.1 * fib);
                c = [c[0] * k, c[1] * k, c[2] * k];
                return {c, h: rim * 3.2 - groove * 1.6 + fib * 0.7, sp: 0.16};
            },
            pista(u, v, s, dist, d) {
                const bl    = fbm(u * 0.018 + 2, v * 0.018, 4),
                      grain = vnoise(u * 0.8, v * 0.05),
                      sp0   = vnoise(u * 0.35 + 20, v * 0.35);
                let c = mix3(
                    [236, 219, 184],
                    [196, 166, 122],
                    sstep(0.45, 0.8, bl),
                );
                c = mix3(c, [150, 112, 74], sstep(0.78, 0.9, sp0) * 0.5);
                const k = 0.93 + 0.12 * grain;
                c = [c[0] * k, c[1] * k, c[2] * k];
                let h = grain * 1.1 + bl * 0.8;
                const t = (v + d.h / 2) / (d.h * 0.46); // 위쪽에 벌어진 틈
                if (t > 0 && t < 1) {
                    const sw = 11 * Math.sin(Math.PI * Math.pow(t, 0.7)),
                          a  = Math.abs(u);
                    if (a < sw + 5) {
                        const lip = sstep(sw + 5, sw, a);
                        h += lip * 2.5 * (a > sw ? 1 : 0);
                        if (a < sw) {
                            const kk = 1 - a / sw;
                            c = mix3([70, 52, 30], [128, 160, 62], sstep(0.25, 0.9, kk));
                            h -= 7 * sstep(0, 0.6, kk);
                        }
                    }
                }
                return {c, h, sp: 0.2};
            },
            walnut(u, v, s, dist, d) {
                const au = Math.abs(u),
                      wx = au * 0.034 + vnoise(u * 0.02, v * 0.02) * 1.2,
                      wy = v * 0.03;
                const r1 = 1 - Math.abs(2 * fbm(wx, wy + 3, 3) - 1),
                      r2 = 1 - Math.abs(2 * vnoise(u * 0.085 + 40, v * 0.085) - 1);
                const g    = Math.pow(r1, 3.2) * 6.5 + Math.pow(r2, 5) * 2.2,
                      fine = vnoise(u * 1.5, v * 1.5);
                let c = mix3([203, 160, 104], [120, 80, 42], clamp(g / 6, 0, 1));
                c = mix3(
                    c,
                    [222, 186, 132],
                    (1 - clamp(g / 3, 0, 1)) * 0.35 * fbm(u * 0.05, v * 0.05, 2),
                );
                let h = -g + fine * 0.5;
                if (au < 16) {
                    h +=
                        4 * sstep(8, 2, au) -
                        3.5 * Math.exp(-Math.pow((au - 9.5) / 2.4, 2));
                    c = mix3(
                        c,
                        [150, 104, 60],
                        Math.exp(-Math.pow((au - 9.5) / 3, 2)) * 0.7,
                    );
                }
                return {
                    c : [
                        c[0] * (0.95 + 0.1 * fine),
                        c[1] * (0.95 + 0.1 * fine),
                        c[2] * (0.95 + 0.1 * fine),
                    ],
                    h,
                    sp: 0.1,
                };
            },
            peanut(u, v, s, dist, d) {
                const w1    = vnoise(u * 0.03, v * 0.012) * 0.5,
                      ribs  = Math.cos((s + w1 * 0.3) * Math.PI * 8.5),
                      cross = Math.cos(
                          v * 0.17 + vnoise(u * 0.05, v * 0.02) * 5 + s * 2,
                      );
                const net = Math.max(
                          sstep(0.1, 0.9, ribs),
                          sstep(0.35, 0.95, cross) * 0.8,
                      ),
                      spk = vnoise(u * 0.9, v * 0.9),
                      bl  = fbm(u * 0.02, v * 0.02, 3);
                let c = mix3([196, 160, 104], [226, 196, 142], net);
                c = mix3(c, [170, 132, 82], sstep(0.55, 0.85, bl) * 0.5);
                const k = 0.92 + 0.14 * spk;
                return {
                    c : [c[0] * k, c[1] * k, c[2] * k],
                    h : net * 2.6 + spk * 0.6,
                    sp: 0.07,
                };
            },
            chestnut(u, v, s, dist, d) {
                const st  = vnoise(s * 16 + 8, v * 0.012),
                      st2 = vnoise(s * 46, v * 0.03);
                let c  = mix3([64, 28, 12], [150, 80, 36], st * 0.55 + st2 * 0.2),
                    sp = 0.75,
                    h  = st2 * 0.35;
                const edge = d.h * 0.2 + 16 * Math.cos(s * Math.PI * 0.5),
                      hil  = sstep(edge - 5, edge + 7, v); // 아래쪽 밝은 배꼽
                if (hil > 0) {
                    const g  = vnoise(u * 0.7, v * 0.7),
                          g2 = fbm(u * 0.05, v * 0.05, 3);
                    const hc = mix3([206, 180, 138], [168, 138, 96], g2);
                    c = mix3(
                        c,
                        [
                            hc[0] * (0.92 + 0.14 * g),
                            hc[1] * (0.92 + 0.14 * g),
                            hc[2] * (0.92 + 0.14 * g),
                        ],
                        hil,
                    );
                    sp *= 1 - hil * 0.95;
                    h += -1.5 * hil + g * 0.8 * hil;
                }
                return {c, h, sp};
            },
            coconut(u, v, s, dist, d) {
                const oy  = v + d.h * 0.3,
                      ang = Math.atan2(u, oy + 30),
                      rad = Math.hypot(u, oy + 30);
                const f1   = vnoise(ang * 46 + 3, rad * 0.022),
                      f2   = vnoise(ang * 150, rad * 0.06),
                      f3   = vnoise(u * 1.3, v * 1.3),
                      hair = f1 * 0.5 + f2 * 0.35 + f3 * 0.15;
                let c = mix3([58, 36, 18], [176, 128, 76], Math.pow(hair, 1.25)),
                    h = hair * 3.6;
                for (const [ex, ey] of [
                    [-26, -d.h * 0.3],
                    [26, -d.h * 0.3],
                    [0, -d.h * 0.17],
                ]) {
                    const r = Math.hypot(u - ex, v - ey);
                    if (r < 20) {
                        const k = sstep(17, 8, r);
                        c = mix3(c, [30, 17, 8], k);
                        h -= 6 * k;
                    }
                }
                return {c, h, sp: 0.05};
            },
        };
        const SHAPE = {
            sun     : [0.3, 0.55, 22],
            pumpkin : [0.28, 0.5, 20],
            pista   : [0.5, 1, 26],
            walnut  : [0.5, 1, 14],
            peanut  : [0.42, 0.9, 12],
            chestnut: [0.5, 1, 70],
            coconut : [0.5, 1, 10],
        }; // [둥근 정도 반지름 비율, 볼록함, 광택 날카로움]
        function renderShell(key) {
            const d  = SEEDS[key],
                  SC = 1.5,
                  w  = d.w + 80,
                  h  = d.h + 90,
                  PW = Math.round(w * SC),
                  PH = Math.round(h * SC),
                  N  = PW * PH;
            const c = document.createElement("canvas");
            c.width = PW;
            c.height = PH;
            const g = c.getContext("2d");
            const keep = ctx;
            ctx = g;
            g.save();
            g.scale(SC, SC);
            g.translate(w / 2, h / 2);
            seedPath(key, d.w, d.h);
            g.fillStyle = "#fff";
            g.fill();
            g.restore();
            ctx = keep;
            const img = g.getImageData(0, 0, PW, PH),
                  px  = img.data;
            const dist = new Float32Array(N),
                  BIG  = 1e6;
            for (let i = 0; i < N; i++) dist[i] = px[i * 4 + 3] > 127 ? BIG : 0;
            for (let y = 1; y < PH - 1; y++)
                for (let x = 1; x < PW - 1; x++) {
                    const i = y * PW + x;
                    if (dist[i])
                        dist[i] = Math.min(
                            dist[i],
                            dist[i - 1] + 1,
                            dist[i - PW] + 1,
                            dist[i - PW - 1] + 1.414,
                            dist[i - PW + 1] + 1.414,
                        );
                }
            for (let y = PH - 2; y > 0; y--)
                for (let x = PW - 2; x > 0; x--) {
                    const i = y * PW + x;
                    if (dist[i])
                        dist[i] = Math.min(
                            dist[i],
                            dist[i + 1] + 1,
                            dist[i + PW] + 1,
                            dist[i + PW + 1] + 1.414,
                            dist[i + PW - 1] + 1.414,
                        );
                }
            const [rr0, bulge, shin] = SHAPE[key],
                  R                  = rr0 * Math.min(d.w, d.h) * SC,
                  HT                 = new Float32Array(N),
                  alb                = new Float32Array(N * 3),
                  spc                = new Float32Array(N),
                  mat                = MAT[key];
            // 줄마다 왼쪽·오른쪽 끝을 구해 부드럽게 다듬음 (가로 줄무늬 잡티 방지)
            const Ls = new Float32Array(PH).fill(-1),
                  Rs = new Float32Array(PH).fill(-1);
            for (let y = 0; y < PH; y++) {
                let L  = -1,
                    Rt = -1;
                for (let x = 0; x < PW; x++)
                    if (dist[y * PW + x]) {
                        if (L < 0) L = x;
